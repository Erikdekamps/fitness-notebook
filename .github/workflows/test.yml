# Runs every test level on every pull request. All of them must pass;
# the "test" job at the end sums them up in one check.
#
#   unit       the logic in index.html, in Node. Nothing to install.
#   browser    the app in Chromium (desktop and phone), then the CRAP check over both levels' coverage
#   mutation   Stryker changes the logic on purpose; the unit tests must notice
#
# Not run on main: there the deploy workflow runs the unit and browser tests first
# and does not publish when they fail.
name: Test

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Unit tests
        run: npm test

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: CRAP check (unit and browser coverage)
        run: npm run test:crap

      - name: Keep the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-reports
          path: |
            reports/e2e/
            reports/crap/
          retention-days: 14

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Mutation tests
        run: npm run test:mutation

      - name: Keep the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14

  # One check that sums up the three above. Branch protection requires "test",
  # so the jobs above can change without changing that rule.
  test:
    needs: [unit, browser, mutation]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: All test levels passed
        run: |
          echo "unit: ${{ needs.unit.result }}, browser: ${{ needs.browser.result }}, mutation: ${{ needs.mutation.result }}"
          test "${{ needs.unit.result }}" = success
          test "${{ needs.browser.result }}" = success
          test "${{ needs.mutation.result }}" = success
