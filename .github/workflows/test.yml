# Runs the unit tests on every pull request.
# They read the app's logic straight out of index.html.
#
# Not run on main: there the deploy workflow runs the same tests first
# and does not publish when they fail.
name: Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: npm test
