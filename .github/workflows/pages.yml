# Publishes the app (index.html and its font) and the design screens to GitHub Pages
# every time main changes.
#
# Three jobs in a chain: test -> build -> deploy.
# Each one only starts when the one before it succeeded,
# so a failing test means nothing is built and nothing goes live.
# The test job runs only the quick unit tests: every pull request already had to pass all
# test levels (the required "test" check in test.yml) before it could be merged.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a running deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Unit tests
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Pages
        uses: actions/configure-pages@v6

      - name: Collect the site
        run: |
          mkdir _site
          cp index.html _site/
          cp -r fonts _site/fonts
          cp -r design _site/design

      # GitHub Pages lets browsers keep a file for 10 minutes, and a browser may keep the font longer.
      # Its address gets ?v= and a hash of its content, so a browser fetches it again only when it changed.
      # index.html itself has no address to change: it can stay old up to those 10 minutes.
      - name: An address that changes with the content of the font
        run: |
          font=$(sha256sum fonts/caveat-latin.woff2 | cut -c1-12)
          sed -i "s|url(\"fonts/caveat-latin.woff2\")|url(\"fonts/caveat-latin.woff2?v=$font\")|" _site/index.html
          # Stop when the line moved and was not changed, instead of publishing without it.
          grep -q "caveat-latin.woff2?v=$font" _site/index.html

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # A job of its own, so it starts well after the upload has finished.
  # Deploying a split second after the upload can fail with
  # "No artifacts named github-pages were found".
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
