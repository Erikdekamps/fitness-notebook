# Publishes the app (index.html and its font) and the design screens to GitHub Pages
# every time main changes.
#
# Three jobs in a chain: test -> build -> deploy.
# Each one only starts when the one before it succeeded,
# so a failing test means nothing is built and nothing goes live.
# The test job runs the unit and browser tests; mutation and CRAP run on pull requests.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a running deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: npm test

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Collect the site
        run: |
          mkdir _site
          cp index.html _site/
          cp -r fonts _site/fonts
          cp -r design _site/design

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # A job of its own, so it starts well after the upload has finished.
  # Deploying a split second after the upload can fail with
  # "No artifacts named github-pages were found".
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
