<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8d3bc">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Notebook">
<meta name="description" content="Log gym sessions on endless notebook paper.">
<title>Fitness Notebook</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e8d3bc'/%3E%3Cpath d='M10 24h44M10 36h44M10 48h44' stroke='%235a5048' stroke-width='2'/%3E%3Cpath d='M15 31c4-7 8-7 10 0s7 7 11 0' stroke='%231d3a8a' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* ==========================================================================
   Fitness Notebook
   Endless lined notebook paper for gym sessions, in one page plus its font file.
   Everything is stored on this device (localStorage).

   CSS sections
     1. Font             5. Lines (rows)          9. Settings
     2. Tokens           6. Add rows             10. Statistics
     3. Base             7. Floating buttons     11. Undo toast
     4. Paper            8. Sheet & wheels       12. Reduced motion
   ========================================================================== */

/* 1. Font ------------------------------------------------------------------
   Caveat by Impallari Type, SIL Open Font License 1.1 (see fonts/README.md).
   Latin subset. Without the file the page falls back to another handwriting font. */
@font-face {
  font-family: "Caveat";
  font-style: normal;
  font-weight: 400 700;
  font-display: swap;
  src: url("fonts/caveat-latin.woff2") format("woff2");
}

/* 2. Tokens ---------------------------------------------------------------- */
:root {
  --paper: #e8d3bc;
  --desk: #d6bfa4;
  --rule: #5a5048;
  --pen: #1d3a8a;
  --pencil: #4d535c;
  --sheet: #f6ecdf;
  --band: #e6dccf;
  --ink: #1c1c1e;
  --muted: #56606e;
  --danger: #b3261e;
  --danger-armed: #8c1d18;

  --line: 44px;            /* one ruled line */
  --text-left: 32px;       /* where the handwriting starts */
  --text-right: 32px;
  --rule-inset: 20px;      /* ruled lines stop a little short of both edges */
  --page-max: 680px;
  --wheel-item: 36px;      /* keep in sync with WHEEL_ITEM_PX */

  --font-hand: "Caveat", "Bradley Hand", "Segoe Print", cursive;
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --ease: cubic-bezier(.2, .8, .2, 1);
}

/* 3. Base ------------------------------------------------------------------ */
*, *::before, *::after { box-sizing: border-box; }

html {
  background: var(--paper);
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--pen);
  font-family: var(--font-hand);
  font-size: 27px;
  font-weight: 500;
  line-height: var(--line);
  -webkit-tap-highlight-color: transparent;
}

h1, h2, p { margin: 0; font: inherit; }

button {
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  line-height: inherit;
  cursor: pointer;
  touch-action: manipulation;
}

:focus-visible { outline: 2px solid var(--pen); outline-offset: -2px; border-radius: 8px; }
[hidden] { display: none !important; }

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

@media (min-width: 700px) {
  html, body { background: var(--desk); }
}

/* 4. Paper ----------------------------------------------------------------- */
.page {
  position: relative;
  max-width: var(--page-max);
  min-height: 100vh;
  min-height: 100svh;
  margin: 0 auto;
  padding: calc(var(--safe-top) + var(--line)) var(--text-right) 0 var(--text-left);
  background: var(--paper);
}

.page::before { /* the ruled lines */
  content: "";
  position: absolute;
  top: var(--safe-top);
  right: var(--rule-inset);
  bottom: 0;
  left: var(--rule-inset);
  background-image: linear-gradient(to bottom, transparent 36px, var(--rule) 36px, var(--rule) 37px, transparent 37px);
  background-size: 100% var(--line);
  pointer-events: none;
}

.page > * { position: relative; }
.bleed { margin-right: calc(-1 * var(--text-right)); margin-left: calc(-1 * var(--text-left)); }
.blank { height: var(--line); }
.filler { height: calc(var(--line) * 4); }

/* 5. Lines (rows) ---------------------------------------------------------- */
.row {
  position: relative;
  clip-path: inset(-7px 0 0 0); /* clip the sides, but let Delete reach up to the ruled line above */
  touch-action: pan-y;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

.row:focus-visible { outline: none; }
.row:focus-visible > .row-content { outline: 2px solid var(--pen); outline-offset: -3px; border-radius: 8px; }

.row-content {
  display: flex;
  flex-wrap: wrap;         /* a line that is too long runs on to the next ruled line */
  align-items: baseline;
  gap: 0 12px;
  min-height: var(--line);
  padding: 0 var(--text-right) 0 var(--text-left);
}

.row-content.is-animating { transition: transform .22s var(--ease); }
.row--text > .row-content, .row-content.is-text { display: block; overflow-wrap: anywhere; }
.row--date > .row-content, .is-bold { font-weight: 700; }
.is-pencil { color: var(--pencil); }

.name { min-width: 0; overflow-wrap: anywhere; }
.nums { flex: none; white-space: nowrap; }
.mark { flex: none; margin-left: auto; white-space: nowrap; }
.mark svg { display: inline-block; }

.row-delete { /* fills the space between two ruled lines */
  position: absolute;
  top: -7px;
  right: var(--rule-inset);
  bottom: 8px;
  width: 0;
  display: flex;
  align-items: center;
  overflow: hidden;
  background: var(--danger);
  color: #fff;
  font: 600 16px/1 var(--font-ui);
  white-space: nowrap;
}

.row-delete > span { padding-left: 24px; }
.row-delete.is-animating { transition: width .22s var(--ease), background-color .15s; }
.row.is-armed > .row-delete { background: var(--danger-armed); }
.row.is-collapsing { overflow: hidden; transition: height .18s ease; }

.line-input {
  display: block;
  flex: 1 1 auto;
  width: 100%;
  min-width: 0;
  height: var(--line);
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: 0;
  outline: none;
  background: transparent;
  color: var(--pen);
  caret-color: var(--pen);
  font: inherit;
  line-height: var(--line);
  -webkit-appearance: none;
  appearance: none;
}

.line-input::placeholder { color: var(--pencil); opacity: 1; }

.is-shaking { animation: shake .32s; }
@keyframes shake {
  20%, 60% { transform: translateX(-6px); }
  40%, 80% { transform: translateX(6px); }
}

/* 6. Add rows -------------------------------------------------------------- */
.add-row { min-height: var(--line); }
.add-row--pencil { padding-left: var(--text-left); }
.pencil-btn { display: block; height: var(--line); color: var(--pencil); text-align: left; }

.add-btn { /* a whole empty line you can tap */
  display: block;
  width: 100%;
  height: var(--line);
  padding: 0 var(--text-right) 0 var(--text-left);
  text-align: left;
}

/* 7. Floating buttons ------------------------------------------------------ */
.topbar { /* plain top margin of the page; the cog sits on it and lines scroll under it */
  position: fixed;
  z-index: 9;
  top: 0;
  left: 50%;
  width: min(100%, var(--page-max));
  height: calc(var(--safe-top) + var(--line));
  transform: translateX(-50%);
  background: var(--paper);
}

.topbar::after { /* soft edge where lines slide under */
  content: "";
  position: absolute;
  top: 100%;
  right: 0;
  left: 0;
  height: 10px;
  background: linear-gradient(var(--paper), rgba(232, 211, 188, 0));
  pointer-events: none;
}

.cog, .today {
  position: fixed;
  z-index: 10;
  display: grid;
  place-items: center;
  border-radius: 50%;
}

.cog {
  top: var(--safe-top);
  right: max(8px, calc((100vw - var(--page-max)) / 2 + 8px));
  width: 44px;
  height: 44px;
  color: var(--pencil);
}

.stats-btn { right: max(52px, calc((100vw - var(--page-max)) / 2 + 52px)); }

.today {
  right: max(20px, calc((100vw - var(--page-max)) / 2 + 20px));
  bottom: calc(28px + var(--safe-bottom));
  width: 52px;
  height: 52px;
  color: #fff;
  background: var(--pen);
  box-shadow: 0 6px 16px rgba(29, 58, 138, .3);
  opacity: 0;
  transform: scale(.6);
  visibility: hidden;
  transition: opacity .2s, transform .2s var(--ease), visibility 0s linear .2s;
}

.today.is-visible {
  opacity: 1;
  transform: none;
  visibility: visible;
  transition: opacity .2s, transform .2s var(--ease);
}

/* 8. Sheet & wheels -------------------------------------------------------- */
.backdrop { position: fixed; inset: 0; z-index: 20; touch-action: none; }

.sheet {
  position: fixed;
  z-index: 21;
  right: 0;
  bottom: 0;
  left: 0;
  padding: 18px 16px calc(20px + var(--safe-bottom));
  border-radius: 20px 20px 0 0;
  background: var(--sheet);
  color: var(--ink);
  box-shadow: 0 -4px 20px rgba(70, 45, 20, .1);
  font-family: var(--font-ui);
  font-weight: 400;
  line-height: 1.3;
  transform: translateY(110%);
  visibility: hidden;
  transition: transform .3s var(--ease), visibility 0s linear .3s;
}

.sheet.is-open { transform: none; visibility: visible; transition: transform .3s var(--ease); }
.sheet-inner { display: flex; flex-direction: column; gap: 10px; max-width: 480px; margin: 0 auto; }
.sheet-pickers { display: flex; flex-direction: column; gap: 10px; }
.sheet.is-typing .sheet-pickers { height: 0; overflow: hidden; visibility: hidden; } /* folded, wheels keep their place */

.sheet-text {
  width: 100%;
  height: 48px;
  margin: 0;
  padding: 0 14px;
  border: 1px solid #cbbba8;
  border-radius: 12px;
  background: #fffaf3;
  color: var(--ink);
  font: 17px/1.2 var(--font-ui);
  -webkit-appearance: none;
  appearance: none;
}

.sheet-text::placeholder { color: var(--muted); opacity: 1; }
.sheet-cols { display: grid; gap: 6px; padding: 0 8px; }
.sheet-labels { font-size: 13px; color: var(--muted); text-align: center; }
.sheet-labels .is-left { padding-left: 4px; text-align: left; }
.wheels { position: relative; }

.wheels-band { /* highlights the picked row across all wheels */
  position: absolute;
  top: calc(var(--wheel-item) * 2);
  right: 0;
  left: 0;
  height: var(--wheel-item);
  border-radius: 9px;
  background: var(--band);
  pointer-events: none;
}

.wheel {
  position: relative;
  height: calc(var(--wheel-item) * 5);
  overflow-x: hidden;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  overscroll-behavior: contain;
  scrollbar-width: none;
  touch-action: pan-y;
  border-radius: 9px;
  font-size: 19px;
  cursor: grab;
}

.wheel::-webkit-scrollbar { display: none; }
.wheel.is-dragging { scroll-snap-type: none; cursor: grabbing; }
.wheel:focus-visible { outline-offset: 0; }
.wheel-pad { height: calc(var(--wheel-item) * 2); }

.wheel-item {
  height: var(--wheel-item);
  overflow: hidden;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  line-height: var(--wheel-item);
  text-align: center;
  text-overflow: ellipsis;
  white-space: nowrap;
  scroll-snap-align: center;
  transform-origin: center;
}

.wheel-item.is-current, .wheel.is-measuring .wheel-item { color: var(--ink); font-weight: 600; }
.wheel--left .wheel-item { padding-left: 4px; text-align: left; transform-origin: left center; }

.sheet-action {
  height: 56px;
  border-radius: 14px;
  background: var(--pen);
  color: #fff;
  font: 600 17px/1 var(--font-ui);
}

.sheet-action:active { opacity: .85; }
.sheet-cancel { height: 48px; margin-bottom: -12px; color: var(--pen); font: 600 17px/1 var(--font-ui); }
.sheet-info { display: flex; flex-direction: column; gap: 4px; padding: 4px 8px 6px; font-size: 15px; line-height: 22px; }
.sheet-info h3 { margin: 0 0 4px; font: 600 17px/22px var(--font-ui); overflow-wrap: anywhere; }
.sheet-info p:last-child { margin-top: 6px; }
.is-muted { color: var(--muted); }

/* 9. Settings -------------------------------------------------------------- */
.section-title { height: var(--line); font-weight: 700; }
.title-row { display: flex; align-items: center; gap: 2px; height: var(--line); font-weight: 700; }

.back-btn {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  margin-left: -14px;
  border-radius: 12px;
  color: var(--pen);
}

.text-btn {
  display: block;
  height: var(--line);
  color: var(--pen);
  font-size: 24px;
  text-align: left;
  text-decoration: underline;
  text-underline-offset: 5px;
}

/* 10. Statistics ----------------------------------------------------------- */
.stat-line { display: flex; align-items: baseline; gap: 14px; min-height: var(--line); }
.is-small { font-size: 22px; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); height: var(--line); text-align: center; }

.stat-link {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  height: var(--line);
  color: var(--pen);
  text-align: left;
}

.month-nav { display: flex; align-items: center; height: var(--line); font-weight: 700; }
.month-name { flex: 1 1 0; text-align: center; }
.month-arrow { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; color: var(--pen); }
.month-arrow:first-child { margin-left: -10px; }
.month-arrow:last-child { margin-right: -10px; }

.chart { position: relative; } /* the ruled lines are its grid; the view sets its height */
.chart svg { position: absolute; top: 0; left: 0; }
.axis { position: absolute; left: 0; color: var(--pencil); font-size: 20px; line-height: 36px; }
.x-labels { position: relative; height: var(--line); color: var(--pencil); font-size: 20px; line-height: 36px; white-space: nowrap; }
.x-labels span { position: absolute; top: 0; transform: translateX(-50%); }

/* 11. Undo toast ----------------------------------------------------------- */
.toast {
  position: fixed;
  z-index: 30;
  bottom: calc(24px + var(--safe-bottom));
  left: 50%;
  display: flex;
  align-items: center;
  gap: 4px;
  height: 48px;
  padding: 0 4px 0 18px;
  border-radius: 24px;
  background: #1c1c1e;
  color: #fff;
  font: 15px/1 var(--font-ui);
  white-space: nowrap;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .25);
  transform: translate(-50%, calc(100% + 40px));
  visibility: hidden;
  transition: transform .25s var(--ease), visibility 0s linear .25s;
}

.toast.is-visible { transform: translate(-50%, 0); visibility: visible; transition: transform .25s var(--ease); }
.toast.is-plain { padding-right: 18px; }
.toast button { height: 44px; padding: 0 14px; border-radius: 22px; color: #a9c1ff; font-weight: 600; }

/* 12. Reduced motion ------------------------------------------------------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: .01ms !important;
    animation-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>
<body>

<main id="notebook" aria-label="Notebook">
  <div class="page">
    <div id="lines" class="bleed" role="list" aria-label="Notebook lines"></div>
    <div id="addArea" class="bleed">
      <div id="rowNext" class="add-row"></div>
      <div id="rowDate" class="add-row"></div>
    </div>
    <div id="notebookFiller" class="filler"></div>
  </div>
</main>

<section id="settings" aria-labelledby="settingsTitle" hidden>
  <div class="page">
    <div class="title-row">
      <button class="back-btn" type="button" data-back="notebook" aria-label="Back to the notebook">
        <svg width="14" height="24" viewBox="0 0 14 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M11 3l-8 9 8 9"/></svg>
      </button>
      <h1 id="settingsTitle">Settings</h1>
    </div>
    <div class="blank" aria-hidden="true"></div>
    <h2 class="section-title">machines</h2>
    <div id="machineList" class="bleed" role="list" aria-label="Machines"></div>
    <div id="addMachineRow" class="bleed add-row add-row--pencil"></div>
    <div class="blank" aria-hidden="true"></div>
    <h2 class="section-title">backup</h2>
    <button id="exportBtn" class="stat-link" type="button"><span>export to a file</span><svg width="12" height="22" viewBox="0 0 12 22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M2 3l8 8-8 8"/></svg></button>
    <button id="importBtn" class="stat-link" type="button"><span>import from a file</span><svg width="12" height="22" viewBox="0 0 12 22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M2 3l8 8-8 8"/></svg></button>
    <input id="importFile" type="file" accept="application/json,.json" aria-label="Backup file to import" hidden>
    <div class="blank" aria-hidden="true"></div>
    <button id="removeExamples" class="text-btn" type="button" hidden>remove the example lines</button>
    <div class="filler" aria-hidden="true"></div>
  </div>
</section>

<section id="stats" aria-labelledby="statsTitle" hidden>
  <div class="page">
    <div class="title-row">
      <button class="back-btn" type="button" data-back="notebook" aria-label="Back to the notebook">
        <svg width="14" height="24" viewBox="0 0 14 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M11 3l-8 9 8 9"/></svg>
      </button>
      <h1 id="statsTitle">Statistics</h1>
    </div>
    <div class="blank" aria-hidden="true"></div>
    <div id="statsBody"></div>
    <div class="filler" aria-hidden="true"></div>
  </div>
</section>

<section id="machineStats" aria-labelledby="machineStatsTitle" hidden>
  <div class="page">
    <div class="title-row">
      <button class="back-btn" type="button" data-back="stats" aria-label="Back to statistics">
        <svg width="14" height="24" viewBox="0 0 14 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M11 3l-8 9 8 9"/></svg>
      </button>
      <h1 id="machineStatsTitle">Machine</h1>
    </div>
    <div class="blank" aria-hidden="true"></div>
    <div id="machineStatsBody"></div>
    <div class="filler" aria-hidden="true"></div>
  </div>
</section>

<div class="topbar" aria-hidden="true"></div>

<button id="statsBtn" class="cog stats-btn" type="button" aria-label="Statistics">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 20h18M6 16v-4M12 16V6M18 16V9"/></svg>
</button>

<button id="cogBtn" class="cog" type="button" aria-label="Settings">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10.12 4.64L10.48 1.91A10.2 10.2 0 0 1 13.52 1.91L13.88 4.64A7.6 7.6 0 0 1 15.88 5.46L18.05 3.79A10.2 10.2 0 0 1 20.21 5.95L18.54 8.12A7.6 7.6 0 0 1 19.36 10.12L22.09 10.48A10.2 10.2 0 0 1 22.09 13.52L19.36 13.88A7.6 7.6 0 0 1 18.54 15.88L20.21 18.05A10.2 10.2 0 0 1 18.05 20.21L15.88 18.54A7.6 7.6 0 0 1 13.88 19.36L13.52 22.09A10.2 10.2 0 0 1 10.48 22.09L10.12 19.36A7.6 7.6 0 0 1 8.12 18.54L5.95 20.21A10.2 10.2 0 0 1 3.79 18.05L5.46 15.88A7.6 7.6 0 0 1 4.64 13.88L1.91 13.52A10.2 10.2 0 0 1 1.91 10.48L4.64 10.12A7.6 7.6 0 0 1 5.46 8.12L3.79 5.95A10.2 10.2 0 0 1 5.95 3.79L8.12 5.46A7.6 7.6 0 0 1 10.12 4.64Z"/><circle cx="12" cy="12" r="3"/></svg>
</button>

<button id="todayBtn" class="today" type="button" aria-label="Back to today">
  <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M11 3v15M4 12l7 7 7-7"/></svg>
</button>

<div id="backdrop" class="backdrop" hidden></div>

<div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-inner">
    <h2 id="sheetTitle" class="visually-hidden">Log a line</h2>
    <div id="sheetInfo" class="sheet-info" hidden></div>
    <div class="sheet-pickers">
      <div id="sheetLabels" class="sheet-cols sheet-labels" aria-hidden="true"></div>
      <div class="wheels">
        <div class="wheels-band" aria-hidden="true"></div>
        <div id="sheetWheels" class="sheet-cols"></div>
      </div>
    </div>
    <input id="sheetText" class="sheet-text" type="text" autocomplete="off" autocapitalize="sentences" enterkeyhint="done" aria-label="Write your own line" hidden>
    <button id="sheetAction" class="sheet-action" type="button">Log</button>
    <button id="sheetCancel" class="sheet-cancel" type="button" hidden>Cancel</button>

<script data-module="calendar" data-testable>
/**
 * Days, weeks and months. Pure functions.
 * A date is "YYYY-MM-DD" and a month is "YYYY-MM", always in local time.
 */
(function (FN) {
  'use strict';
  const { DAY_NAMES } = FN.config;

  const pad = (n) => String(n).padStart(2, '0');

  const Calendar = {
    /* ---- Days ---- */

    toIso(y, m, d) {
      return `${y}-${pad(m)}-${pad(d)}`;
    },

    today() {
      const now = new Date();
      return Calendar.toIso(now.getFullYear(), now.getMonth() + 1, now.getDate());
    },

    parts(iso) {
      const [y, m, d] = iso.split('-').map(Number);
      return { y, m, d };
    },

    daysInMonth(y, m) {
      return new Date(y, m, 0).getDate();
    },

    /** How a date is written in the notebook: "18/11" + "wo" ("18/11/25" when it is not this year). */
    written(iso) {
      const { y, m, d } = Calendar.parts(iso);
      const year = y === new Date().getFullYear() ? '' : '/' + String(y).slice(-2);
      return { date: `${pad(d)}/${pad(m)}${year}`, day: DAY_NAMES[new Date(y, m - 1, d).getDay()] };
    },

    /* ---- Weeks ---- */

    /** The Monday of the week a date falls in. */
    mondayOf(iso) {
      const { y, m, d } = Calendar.parts(iso);
      const date = new Date(y, m - 1, d);
      date.setDate(date.getDate() - ((date.getDay() + 6) % 7));
      return Calendar.toIso(date.getFullYear(), date.getMonth() + 1, date.getDate());
    },

    /** The Monday one week before the given Monday. */
    weekBefore(mondayIso) {
      const { y, m, d } = Calendar.parts(mondayIso);
      const date = new Date(y, m - 1, d - 7);
      return Calendar.toIso(date.getFullYear(), date.getMonth() + 1, date.getDate());
    },

    /**
     * Weeks in a row with at least one of `dates` in them, counting back from this week
     * (or from last week, when this week is still empty).
     */
    weeksInARow(dates, today) {
      const weeks = new Set(Array.from(dates, (date) => Calendar.mondayOf(date)));
      let week = Calendar.mondayOf(today);
      if (!weeks.has(week)) week = Calendar.weekBefore(week);
      let count = 0;
      while (weeks.has(week)) {
        count++;
        week = Calendar.weekBefore(week);
      }
      return count;
    },

    /* ---- Months ---- */

    /** The month a date falls in. */
    monthOf(iso) {
      return iso.slice(0, 7);
    },

    monthParts(month) {
      return { y: Number(month.slice(0, 4)), m: Number(month.slice(5, 7)) };
    },

    /** The month `by` months after (or, when negative, before) a month. */
    shiftMonth(month, by) {
      const { y, m } = Calendar.monthParts(month);
      const date = new Date(y, m - 1 + by, 1);
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}`;
    },

    /** The months you can look at: from the oldest month among `dates` up to the month of `today`. */
    monthRange(dates, today) {
      const last = Calendar.monthOf(today);
      let first = last;
      for (const date of dates) {
        if (Calendar.monthOf(date) < first) first = Calendar.monthOf(date);
      }
      return { first, last };
    },

    /** The month itself when it is inside the range, else the nearest end of the range. */
    clampMonth(month, range) {
      if (month < range.first) return range.first;
      if (month > range.last) return range.last;
      return month;
    },

    /**
     * The cells of a month's week grid, Monday first.
     * Each cell is 'blank' (before the 1st), 'trained' (one of `dates`) or 'rest'. Days after `today` are left out.
     */
    monthCells(dates, year, month, today) {
      const cells = [];
      const leading = (new Date(year, month - 1, 1).getDay() + 6) % 7;
      for (let i = 0; i < leading; i++) cells.push({ day: null, state: 'blank' });
      for (let day = 1; day <= Calendar.daysInMonth(year, month); day++) {
        const iso = Calendar.toIso(year, month, day);
        if (iso > today) break;
        cells.push({ day, state: dates.has(iso) ? 'trained' : 'rest' });
      }
      return cells;
    },

    /** How many of the cells are days trained. */
    countTrained(cells) {
      return cells.filter((cell) => cell.state === 'trained').length;
    },
  };

  FN.calendar = { Calendar };
})(globalThis.FN = globalThis.FN || {});
</script>

<script data-module="progress" data-testable>
/**
 * What the lines say about your training. Pure functions over lines.
 *
 * A line is one of
 *   { id, type: 'date', date }                                   date = "YYYY-MM-DD"
 *   { id, type: 'text', text }
 *   { id, type: 'machine', machineId, name, weight, sets, reps }
 * Lines stay in the order they were written; a date line starts a new day.
 */
(function (FN) {
  'use strict';
  const { KG_STEP, KG_MAX } = FN.config;
  const { round2 } = FN.util;

  const byDateThenOrder = (a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.order - b.order);

  const Progress = {
    /* ---- Days ---- */

    /** The dates that have a date line, as a Set of "YYYY-MM-DD". */
    sessionDates(lines) {
      return new Set(lines.filter((line) => line.type === 'date').map((line) => line.date));
    },

    /** Machines already written since the last date line. */
    machinesInCurrentDay(lines) {
      const ids = new Set();
      for (let i = lines.length - 1; i >= 0 && lines[i].type !== 'date'; i--) {
        if (lines[i].type === 'machine') ids.add(lines[i].machineId);
      }
      return ids;
    },

    /**
     * The lines without the date lines, put in date order (lines written before any date come first).
     * Days with the same date keep the order they were written in.
     */
    linesInDateOrder(lines) {
      const undated = [];
      const days = [];
      lines.forEach((line, order) => {
        if (line.type === 'date') days.push({ date: line.date, order, lines: [] });
        else if (days.length) days[days.length - 1].lines.push(line);
        else undated.push(line);
      });
      days.sort(byDateThenOrder);
      return undated.concat(...days.map((day) => day.lines));
    },

    /* ---- Marks: ↑, ↓ or –N ---- */

    /** How a weight compares with last time: 'up', 'down', or how many times in a row it stayed the same. */
    markFor(weight, previous) {
      if (!previous) return { mark: null, repeats: 0 };
      if (weight > previous.weight) return { mark: 'up', repeats: 0 };
      if (weight < previous.weight) return { mark: 'down', repeats: 0 };
      const repeats = previous.repeats + 1;
      return { mark: repeats, repeats };
    },

    /**
     * Compares every machine line with the previous time on that machine, in date order.
     *   marks:  line id → 'up' (heavier), 'down' (lighter), a number (same weight, times in a row) or null (first time)
     *   latest: machine id → { weight, sets, reps, repeats } of the most recent time
     */
    analyzeLines(lines) {
      const marks = new Map();
      const latest = new Map();
      for (const line of Progress.linesInDateOrder(lines)) {
        if (line.type !== 'machine') continue;
        const { mark, repeats } = Progress.markFor(line.weight, latest.get(line.machineId));
        latest.set(line.machineId, { weight: line.weight, sets: line.sets, reps: line.reps, repeats });
        marks.set(line.id, mark);
      }
      return { marks, latest };
    },

    /* ---- One machine over time ---- */

    /** Every dated time a machine was logged, oldest first: [{ date, weight }]. */
    machineHistory(lines, machineId) {
      const points = [];
      let date = null;
      lines.forEach((line, order) => {
        if (line.type === 'date') date = line.date;
        else if (line.type === 'machine' && line.machineId === machineId && date) points.push({ date, order, weight: line.weight });
      });
      return points.sort(byDateThenOrder).map(({ date: when, weight }) => ({ date: when, weight }));
    },

    /** The positions in a history where the weight is new: the first time, and every time it changed. */
    changeIndexes(points) {
      const indexes = [];
      points.forEach((point, i) => {
        if (i === 0 || point.weight !== points[i - 1].weight) indexes.push(i);
      });
      return indexes;
    },

    /** The times the weight was new, oldest first: [{ date, weight }]. */
    weightChanges(points) {
      return Progress.changeIndexes(points).map((i) => points[i]);
    },

    /* ---- The kg wheel ---- */

    /** The kg values on the wheel: 0 to KG_MAX in steps of KG_STEP, always including `mustInclude`. */
    kgOptions(mustInclude) {
      const value = round2(Number(mustInclude) || 0);
      const max = Math.max(KG_MAX, value);
      const options = [];
      for (let i = 0; round2(i * KG_STEP) <= max; i++) options.push(round2(i * KG_STEP));
      if (!options.includes(value)) {
        options.push(value);
        options.sort((a, b) => a - b);
      }
      return options;
    },
  };

  FN.progress = { Progress };
})(globalThis.FN = globalThis.FN || {});
</script>

<script data-module="chartMath" data-testable>
/** The geometry of what the statistics draw: a chart on the ruled lines, and tally marks. Pure functions. */
(function (FN) {
  'use strict';
  const { round2, clamp } = FN.util;
  const { Calendar } = FN.calendar;

  const ChartMath = {
    /** The kg one ruled line can stand for, smallest first. */
    KG_PER_LINE: [2.5, 5, 10, 20, 25, 50, 100],

    /**
     * The scale of a chart drawn on at most `maxRows` ruled lines: the kg on the top line and the kg per line,
     * chosen as small as possible while every weight still fits.
     */
    scale(weights, maxRows) {
      const min = Math.min(...weights);
      const max = Math.max(...weights);
      for (const perLine of ChartMath.KG_PER_LINE) {
        const top = Math.ceil(max / perLine) * perLine;
        if ((top - min) / perLine <= maxRows - 1) return { top, perLine };
      }
      const perLine = ChartMath.KG_PER_LINE[ChartMath.KG_PER_LINE.length - 1];
      return { top: Math.ceil(max / perLine) * perLine, perLine };
    },

    /** How many ruled lines the chart needs to reach its lowest weight: at least 2, at most `maxRows`. */
    rowsNeeded(weights, scale, maxRows) {
      const needed = Math.ceil((scale.top - Math.min(...weights)) / scale.perLine) + 1;
      return clamp(needed, 2, maxRows);
    },

    /** The kg written next to each ruled line, top line first: [{ row, value }]. Never below 0. */
    axisValues(scale, rows) {
      const values = [];
      for (let row = 0; row < rows; row++) {
        const value = round2(scale.top - row * scale.perLine);
        if (value >= 0) values.push({ row, value });
      }
      return values;
    },

    /**
     * Where each point goes, in pixels.
     * Points are spread evenly from `left` to `right`; a weight on a ruled line sits exactly on it.
     */
    pointPositions(points, scale, { left, right, firstLineY, lineHeight }) {
      const step = points.length > 1 ? (right - left) / (points.length - 1) : 0;
      return points.map((point, i) => ({
        x: round2(points.length > 1 ? left + i * step : right),
        y: round2(firstLineY + ((scale.top - point.weight) / scale.perLine) * lineHeight),
      }));
    },

    /** True when every position is at least `minGap` pixels after the one before it. */
    spacedOut(xs, minGap) {
      return xs.every((x, i) => i === 0 || x - xs[i - 1] >= minGap);
    },

    /**
     * Which points get a month label under the chart: the first point of each month,
     * skipping a label that would sit closer than `minGap` pixels to the one before.
     * Returns [{ x, year, month }] with month 1 to 12.
     */
    monthLabels(points, positions, minGap) {
      const labels = [];
      let lastMonth = '';
      let lastX = -Infinity;
      points.forEach((point, i) => {
        const month = Calendar.monthOf(point.date);
        if (month === lastMonth) return;
        lastMonth = month;
        if (positions[i].x - lastX < minGap) return;
        lastX = positions[i].x;
        const { y, m } = Calendar.monthParts(month);
        labels.push({ x: positions[i].x, year: y, month: m });
      });
      return labels;
    },

    /** Hand-drawn tally marks as an SVG path: four strokes and a slash for every five. Returns { path, width }. */
    tallyMarks(count) {
      const fives = Math.floor(count / 5);
      const rest = count % 5;
      let path = '';
      for (let g = 0; g < fives; g++) {
        const x = g * 46;
        path += `M${x + 4} 3l-1 20M${x + 13} 2l-1 21M${x + 22} 3l0 20M${x + 31} 2l-1 21M${x} 19L${x + 36} 6`;
      }
      for (let i = 0; i < rest; i++) path += `M${fives * 46 + 4 + i * 9} ${i % 2 ? 2 : 3}l-1 20`;
      return { path, width: fives * 46 + (rest ? rest * 9 + 2 : 0) };
    },
  };

  FN.chartMath = { ChartMath };
})(globalThis.FN = globalThis.FN || {});
</script>

<script data-module="backup" data-testable>
/**
 * Backup: notebook data as a JSON file, and back. Pure functions.
 *
 * File shape
 *   { "app": "fitness-notebook", "version": 1, "exportedAt": "<ISO time>", "unit": "kg",
 *     "machines": [{ id, name }],
 *     "lines": [{ id, type: "date", date } | { id, type: "text", text } |
 *               { id, type: "machine", machineId, name, weight, sets, reps }] }
 * Rules for reading a file
 *   - it must say app "fitness-notebook"; anything else is refused
 *   - a newer version than this app knows is refused, never half-read
 *   - fields this app does not know are ignored, so later versions can add things
 */
(function (FN) {
  'use strict';
  const { cleanName, newId } = FN.util;
  const { Calendar } = FN.calendar;

  const isCount = (n) => Number.isFinite(n) && n >= 0;
  const count = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;

  const Backup = {
    APP: 'fitness-notebook',
    VERSION: 1,

    /** The name of a backup file made on `today` ("YYYY-MM-DD"). */
    fileName(today) {
      return `fitness-notebook-${today}.json`;
    },

    /** A machine with only the fields this app knows, or null when it cannot be used. */
    cleanMachine(machine) {
      if (!machine || typeof machine.id !== 'string' || typeof machine.name !== 'string' || !cleanName(machine.name)) return null;
      return { id: machine.id, name: cleanName(machine.name) };
    },

    /** A line with only the fields this app knows, or null when it cannot be used. */
    cleanLine(line) {
      if (!line) return null;
      const id = typeof line.id === 'string' && line.id ? line.id : newId('l');
      if (line.type === 'date' && /^\d{4}-\d{2}-\d{2}$/.test(line.date)) return { id, type: 'date', date: line.date };
      if (line.type === 'text' && typeof line.text === 'string' && line.text.trim()) return { id, type: 'text', text: line.text.trim() };
      if (
        line.type === 'machine' &&
        typeof line.machineId === 'string' &&
        typeof line.name === 'string' &&
        isCount(line.weight) && isCount(line.sets) && isCount(line.reps)
      ) {
        const { machineId, name, weight, sets, reps } = line;
        return { id, type: 'machine', machineId, name, weight, sets, reps };
      }
      return null;
    },

    /** Notebook data as a backup object. `now` is the Date of the export. */
    toObject(data, now) {
      return {
        app: Backup.APP,
        version: Backup.VERSION,
        exportedAt: now.toISOString(),
        unit: 'kg',
        machines: data.machines.map((m) => Backup.cleanMachine(m)).filter(Boolean),
        lines: data.lines.map((l) => Backup.cleanLine(l)).filter(Boolean),
      };
    },

    /** Notebook data as the text of a backup file. */
    toJson(data, now) {
      return JSON.stringify(Backup.toObject(data, now), null, 2);
    },

    /** Reads the text of a backup file. Returns { data } (notebook data) or { error }. */
    parse(text) {
      let file;
      try {
        file = JSON.parse(text);
      } catch (_) {
        return { error: 'That is not a JSON file' };
      }
      if (!file || file.app !== Backup.APP || !Array.isArray(file.machines) || !Array.isArray(file.lines)) {
        return { error: 'That is not a Fitness Notebook file' };
      }
      if (typeof file.version !== 'number' || file.version > Backup.VERSION) {
        return { error: 'That file is from a newer version of the app' };
      }
      return {
        data: {
          version: 1,
          machines: file.machines.map((m) => Backup.cleanMachine(m)).filter(Boolean),
          lines: file.lines.map((l) => Backup.cleanLine(l)).filter(Boolean),
        },
      };
    },

    /** A short description of notebook data, for the "replace?" question: [lines and dates, machines]. */
    describe(data) {
      const dates = data.lines.filter((l) => l.type === 'date').map((l) => l.date).sort();
      let lines = count(data.lines.length, 'line');
      if (dates.length === 1) lines += `, on ${Calendar.written(dates[0]).date}`;
      else if (dates.length > 1) lines += `, from ${Calendar.written(dates[0]).date} to ${Calendar.written(dates[dates.length - 1]).date}`;
      return [lines, count(data.machines.length, 'machine')];
    },
  };

  FN.backup = { Backup };
})(globalThis.FN = globalThis.FN || {});
</script>

<script data-module="store" data-testable>

<script data-module="notebook" data-testable>
/**
 * The notebook: its machines and its lines, and every change to them.
 * This is the one place that changes the data. Each change saves right away;
 * a change that can be undone returns its undo.
 *
 * Data shape
 *   { version: 1, machines: [{ id, name }], lines: [ ...see progress... ] }
 *   `example: true` marks the demo lines a new notebook starts with.
 */
(function (FN) {
  'use strict';
  const { newId, cleanName, sameName } = FN.util;

  class Notebook {
    /** data: { version, machines, lines }. onSave(data) runs after every change. */
    constructor(data, { onSave = () => {} } = {}) {
      this.data = data;
      this.onSave = onSave;
    }

    get lines() {

        ['2026-11-11', 'Biking Basics New Zealand #13', [['Chest press', 32.5, 3, 10], ['Shoulder press', 20, 3, 10], ['Seated row', 40, 3, 12]]],
        ['2026-11-14', 'Biking Basics New Zealand #14', [['Leg press', 75, 3, 12], ['Chest press', 35, 3, 10], ['Lat pulldown', 45, 3, 12]]],

<script data-module="lineMarkup" data-testable>
/** How lines are written on the paper, as HTML. Pure: lines in, text out. */

    /** The ↑, ↓ or –N at the end of a machine line ('' for the first time). */

      if (mark === 'up') return `<span class="mark" role="img" aria-label="heavier than last time">${Icons.up}</span>`;
      if (mark === 'down') return `<span class="mark" role="img" aria-label="lighter than last time">${Icons.down}</span>`;
      if (typeof mark === 'number') {

      if (line.type === 'text') return escapeHtml(line.text);
      return (
        `<span class="name">${escapeHtml(line.name)}</span>` +
        `<span class="nums">${formatKg(line.weight)} × ${Number(line.sets)} × ${Number(line.reps)}</span>` +
        LineMarkup.mark(mark)

        `<div class="row row--${line.type}" role="listitem" tabindex="0" data-key="${escapeHtml(line.id)}">` +
        `<div class="row-content">${LineMarkup.content(line, mark)}</div>` +
        '<button class="row-delete" type="button" tabindex="-1" aria-label="Delete line"><span>Delete</span></button>' +
        '</div>'

<script data-module="dom">
/** Small helpers that touch the page. */

  const byId = (id) => document.getElementById(id);

  /** Runs fn at most once per animation frame. */
  function onNextFrame(fn) {
    let queued = false;
    return () => {
      if (queued) return;
      queued = true;
      requestAnimationFrame(() => { queued = false; fn(); });
    };
  }

  /** Plays the "no" shake on an element. */
  function shake(el) {
    el.classList.remove('is-shaking');
    void el.offsetWidth; // restart the animation
    el.classList.add('is-shaking');
  }

    window.scrollTo({ top: document.documentElement.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
  }

  function downloadFile(fileName, text, type = 'application/json') {
    const url = URL.createObjectURL(new Blob([text], { type }));
    const link = document.createElement('a');
    link.href = url;
    link.download = fileName;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

<script data-module="toast">

<script data-module="lineInput">
/**
 * A handwriting-styled text field that sits on a ruled line.
 * Enter submits, Escape cancels, tapping anywhere else submits and closes.
 * onSubmit(text, el) returns 'close' (default), 'clear' (stay open for another) or 'keep' (stay, keep the text).
 */

  'use strict';

  class LineInput {
    constructor({ value = '', placeholder = '', label, onSubmit, onClose }) {
      this.onSubmit = onSubmit;
      this.onClose = onClose;
      this.closed = false;

      const el = document.createElement('input');
      el.type = 'text';
      el.className = 'line-input';
      el.value = value;
      el.placeholder = placeholder;
      el.autocomplete = 'off';

      el.setAttribute('enterkeyhint', 'done');

      this.onPointerDownOutside = (e) => {
        if (e.target !== el) el.blur();

      el.addEventListener('keydown', (e) => this.onKey(e));
      el.addEventListener('blur', () => {
        if (this.closed) return;
        this.onSubmit(el.value.trim(), el);
        this.close();
      });
      document.addEventListener('pointerdown', this.onPointerDownOutside, true);
    }

    /** Puts the cursor in the field, after the text. Call it once the field is on the page. */
    focus() {
      this.el.focus();
      const end = this.el.value.length;
      this.el.setSelectionRange(end, end);
    }

    onKey(e) {
      if (e.isComposing || e.keyCode === 229) return;
      if (e.key === 'Enter') {
        e.preventDefault();
        const result = this.onSubmit(this.el.value.trim(), this.el) || 'close';
        if (result === 'clear') this.el.value = '';
        else if (result === 'close') this.close();
      } else if (e.key === 'Escape') {
        e.preventDefault();
        this.close();
      }
    }

    close() {

<script data-module="wheel">
/**
 * One iOS-style picker wheel. It is a native scroll container with scroll snapping,
 * so momentum and feel come from the browser. Works with touch, mouse wheel,

  const { WHEEL_ITEM_PX } = FN.config;

  const { onNextFrame } = FN.dom;

  class Wheel {
    /** onChange(index) while it turns, onSettle(index) once it stops. */

      this.onSettle = onSettle;

      this.settleTimer = 0;

      this.swallowClick = false;
      this.styled = new Set();
      this.syncOnFrame = onNextFrame(() => this.sync(false));

      this.listen();
    }

    /** The picked item. */
    get index() {
      return this.current;
    }

    /** Replaces the items. Call it once the wheel is on the page. */
    setItems(list, index) {
      this.items = list;
      this.el.innerHTML =
        '<div class="wheel-pad"></div>' +
        list.map((text, i) => `<div class="wheel-item" data-index="${i}">${escapeHtml(text)}</div>`).join('') +
        '<div class="wheel-pad"></div>';
      this.el.setAttribute('aria-valuemin', '0');
      this.el.setAttribute('aria-valuemax', String(list.length - 1));
      this.styled.clear();
      this.current = -1;
      if (this.align === 'left') this.fitText();
      this.setIndex(index, false);
    }

    /** Moves to an item. Instant moves are silent; smooth moves report changes as they scroll. */
    setIndex(index, smooth) {
      const top = clamp(index, 0, this.items.length - 1) * WHEEL_ITEM_PX;
      if (smooth) {
        this.el.scrollTo({ top, behavior: 'smooth' });
        return;
      }
      this.el.scrollTop = top;
      this.sync(true);
    }

    itemAt(i) {
      return this.el.children[i + 1]; // children[0] is the top padding
    }

    /** Shrinks the text until the longest name fits, so names are never cut off. */
    fitText() {
      const el = this.el;
      el.style.fontSize = '';
      el.classList.add('is-measuring'); // measure at the bold weight of the picked row
      const nodes = Array.from(el.querySelectorAll('.wheel-item'));
      let size = parseFloat(getComputedStyle(el).fontSize);
      while (size > 12 && nodes.some((node) => node.scrollWidth > node.clientWidth)) {
        size -= 1;
        el.style.fontSize = `${size}px`;

      el.classList.remove('is-measuring');

    sync(silent) {
      if (!this.items.length) return;
      const position = this.el.scrollTop / WHEEL_ITEM_PX;
      const index = clamp(Math.round(position), 0, this.items.length - 1);
      const first = Math.max(0, Math.floor(position) - 3);
      const last = Math.min(this.items.length - 1, Math.ceil(position) + 3);

      for (const i of this.styled) {
        if (i >= first && i <= last) continue;
        const node = this.itemAt(i);
        node.style.transform = '';
        node.style.opacity = '';
        node.classList.remove('is-current');
        this.styled.delete(i);
      }
      for (let i = first; i <= last; i++) {
        const node = this.itemAt(i);
        const distance = Math.abs(i - position);
        node.style.transform = `scale(${Math.max(0.74, 1 - distance * 0.08).toFixed(3)})`;
        node.style.opacity = Math.max(0.3, 1 - distance * 0.24).toFixed(3);
        node.classList.toggle('is-current', i === index);
        this.styled.add(i);

      if (index !== this.current) {
        this.current = index;
        this.el.setAttribute('aria-valuenow', String(index));
        this.el.setAttribute('aria-valuetext', this.items[index]);

        this.syncOnFrame();

        this.settleTimer = setTimeout(() => this.settle(), 160);
      }, { passive: true });
      el.addEventListener('scrollend', () => this.settle());

      el.addEventListener('click', (e) => {
        if (this.swallowClick) {
          this.swallowClick = false;
          return;
        }
        const item = e.target.closest('.wheel-item');
        if (item) this.setIndex(Number(item.dataset.index), true);

      el.addEventListener('keydown', (e) => {
        const step = { ArrowUp: -1, ArrowDown: 1, PageUp: -5, PageDown: 5 }[e.key];
        let target = null;
        if (step) target = Math.round(el.scrollTop / WHEEL_ITEM_PX) + step;
        else if (e.key === 'Home') target = 0;
        else if (e.key === 'End') target = this.items.length - 1;
        if (target === null) return;
        e.preventDefault();
        el.scrollTop = clamp(target, 0, this.items.length - 1) * WHEEL_ITEM_PX; // the scroll event reports it

    }

    endDrag() {
      if (!this.drag) return;
      this.swallowClick = this.drag.moved;
      this.drag = null;
      this.el.classList.remove('is-dragging');
