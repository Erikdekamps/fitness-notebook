<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8d3bc">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Notebook">
<meta name="description" content="Log gym sessions on endless notebook paper.">
<title>Fitness Notebook</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e8d3bc'/%3E%3Cpath d='M10 24h44M10 36h44M10 48h44' stroke='%235a5048' stroke-width='2'/%3E%3Cpath d='M15 31c4-7 8-7 10 0s7 7 11 0' stroke='%231d3a8a' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* ==========================================================================
   Fitness Notebook
   Endless lined notebook paper for gym sessions, in one page plus its font file.
   Everything is stored on this device (localStorage).

   CSS sections
     1. Font             5. Lines (rows)          9. Settings
     2. Tokens           6. Add rows             10. Statistics
     3. Base             7. Floating buttons     11. Undo toast
     4. Paper            8. Sheet & wheels       12. Reduced motion
   ========================================================================== */

/* 1. Font ------------------------------------------------------------------
   Caveat by Impallari Type, SIL Open Font License 1.1 (see fonts/README.md).
   Latin subset. Without the file the page falls back to another handwriting font. */
@font-face {
  font-family: "Caveat";
  font-style: normal;
  font-weight: 400 700;
  font-display: swap;
  src: url("fonts/caveat-latin.woff2") format("woff2");
}

/* 2. Tokens ---------------------------------------------------------------- */
:root {
  --paper: #e8d3bc;
  --desk: #d6bfa4;
  --rule: #5a5048;
  --pen: #1d3a8a;
  --pencil: #4d535c;
  --sheet: #f6ecdf;
  --band: #e6dccf;
  --ink: #1c1c1e;
  --muted: #56606e;
  --danger: #b3261e;
  --danger-armed: #8c1d18;

  --line: 44px;            /* one ruled line */
  --text-left: 32px;       /* where the handwriting starts */
  --text-right: 32px;
  --rule-inset: 20px;      /* ruled lines stop a little short of both edges */
  --page-max: 680px;
  --wheel-item: 36px;      /* keep in sync with WHEEL_ITEM_PX */

  --font-hand: "Caveat", "Bradley Hand", "Segoe Print", cursive;
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --ease: cubic-bezier(.2, .8, .2, 1);
}

/* 3. Base ------------------------------------------------------------------ */
*, *::before, *::after { box-sizing: border-box; }

html {
  background: var(--paper);
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--pen);
  font-family: var(--font-hand);
  font-size: 27px;
  font-weight: 500;
  line-height: var(--line);
  -webkit-tap-highlight-color: transparent;
}

h1, h2, p { margin: 0; font: inherit; }

button {
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  line-height: inherit;
  cursor: pointer;
  touch-action: manipulation;
}

:focus-visible { outline: 2px solid var(--pen); outline-offset: -2px; border-radius: 8px; }
[hidden] { display: none !important; }

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

@media (min-width: 700px) {
  html, body { background: var(--desk); }
}

/* 4. Paper ----------------------------------------------------------------- */
.page {
  position: relative;
  max-width: var(--page-max);
  min-height: 100vh;
  min-height: 100svh;
  margin: 0 auto;
  padding: calc(var(--safe-top) + var(--line)) var(--text-right) 0 var(--text-left);
  background: var(--paper);
}

.page::before { /* the ruled lines */
  content: "";
  position: absolute;
  top: var(--safe-top);
  right: var(--rule-inset);
  bottom: 0;
  left: var(--rule-inset);
  background-image: linear-gradient(to bottom, transparent 36px, var(--rule) 36px, var(--rule) 37px, transparent 37px);
  background-size: 100% var(--line);
  pointer-events: none;
}

.page > * { position: relative; }
.bleed { margin-right: calc(-1 * var(--text-right)); margin-left: calc(-1 * var(--text-left)); }
.blank { height: var(--line); }
.filler { height: calc(var(--line) * 4); }

/* 5. Lines (rows) ---------------------------------------------------------- */
.row {
  position: relative;
  clip-path: inset(-7px 0 0 0); /* clip the sides, but let Delete reach up to the ruled line above */
  touch-action: pan-y;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

.row:focus-visible { outline: none; }
.row:focus-visible > .row-content { outline: 2px solid var(--pen); outline-offset: -3px; border-radius: 8px; }

.row-content {
  display: flex;
  flex-wrap: wrap;         /* a line that is too long runs on to the next ruled line */
  align-items: baseline;
  gap: 0 12px;
  min-height: var(--line);
  padding: 0 var(--text-right) 0 var(--text-left);
}

.row-content.is-animating { transition: transform .22s var(--ease); }
.row--text > .row-content, .row-content.is-text { display: block; overflow-wrap: anywhere; }
.row--date > .row-content, .is-bold { font-weight: 700; }
.is-pencil { color: var(--pencil); }

.name { min-width: 0; overflow-wrap: anywhere; }
.nums { flex: none; white-space: nowrap; }
.mark { flex: none; margin-left: auto; white-space: nowrap; }
.mark svg { display: inline-block; }

.row-delete { /* fills the space between two ruled lines */
  position: absolute;
  top: -7px;
  right: var(--rule-inset);
  bottom: 8px;
  width: 0;
  display: flex;
  align-items: center;
  overflow: hidden;
  background: var(--danger);
  color: #fff;
  font: 600 16px/1 var(--font-ui);
  white-space: nowrap;
}

.row-delete > span { padding-left: 24px; }
.row-delete.is-animating { transition: width .22s var(--ease), background-color .15s; }
.row.is-armed > .row-delete { background: var(--danger-armed); }
.row.is-collapsing { overflow: hidden; transition: height .18s ease; }

.line-input {
  display: block;
  flex: 1 1 auto;
  width: 100%;
  min-width: 0;
  height: var(--line);
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: 0;
  outline: none;
  background: transparent;
  color: var(--pen);
  caret-color: var(--pen);
  font: inherit;
  line-height: var(--line);
  -webkit-appearance: none;
  appearance: none;
}

.line-input::placeholder { color: var(--pencil); opacity: 1; }

.is-shaking { animation: shake .32s; }
@keyframes shake {
  20%, 60% { transform: translateX(-6px); }
  40%, 80% { transform: translateX(6px); }
}

/* 6. Add rows -------------------------------------------------------------- */
.add-row { min-height: var(--line); }
.add-row--pencil { padding-left: var(--text-left); }
.pencil-btn { display: block; height: var(--line); color: var(--pencil); text-align: left; }

.add-btn { /* a whole empty line you can tap */
  display: block;
  width: 100%;
  height: var(--line);
  padding: 0 var(--text-right) 0 var(--text-left);
  text-align: left;
}

/* 7. Floating buttons ------------------------------------------------------ */
.topbar { /* plain top margin of the page; the cog sits on it and lines scroll under it */
  position: fixed;
  z-index: 9;
  top: 0;
  left: 50%;
  width: min(100%, var(--page-max));
  height: calc(var(--safe-top) + var(--line));
  transform: translateX(-50%);
  background: var(--paper);
}

.topbar::after { /* soft edge where lines slide under */
  content: "";
  position: absolute;
  top: 100%;
  right: 0;
  left: 0;
  height: 10px;
  background: linear-gradient(var(--paper), rgba(232, 211, 188, 0));
  pointer-events: none;
}

.cog, .today {
  position: fixed;
  z-index: 10;
  display: grid;
  place-items: center;
  border-radius: 50%;
}

.cog {
  top: var(--safe-top);
  right: max(8px, calc((100vw - var(--page-max)) / 2 + 8px));
  width: 44px;
  height: 44px;
  color: var(--pencil);
}

.stats-btn { right: max(52px, calc((100vw - var(--page-max)) / 2 + 52px)); }

.today {
  right: max(20px, calc((100vw - var(--page-max)) / 2 + 20px));
  bottom: calc(28px + var(--safe-bottom));
  width: 52px;
  height: 52px;
  color: #fff;
  background: var(--pen);
  box-shadow: 0 6px 16px rgba(29, 58, 138, .3);
  opacity: 0;
  transform: scale(.6);
  visibility: hidden;
  transition: opacity .2s, transform .2s var(--ease), visibility 0s linear .2s;
}

.today.is-visible {
  opacity: 1;
  transform: none;
  visibility: visible;
  transition: opacity .2s, transform .2s var(--ease);
}

/* 8. Sheet & wheels -------------------------------------------------------- */
.backdrop { position: fixed; inset: 0; z-index: 20; touch-action: none; }

.sheet {
  position: fixed;
  z-index: 21;
  right: 0;
  bottom: 0;
  left: 0;
  padding: 18px 16px calc(20px + var(--safe-bottom));
  border-radius: 20px 20px 0 0;
  background: var(--sheet);
  color: var(--ink);
  box-shadow: 0 -4px 20px rgba(70, 45, 20, .1);
  font-family: var(--font-ui);
  font-weight: 400;
  line-height: 1.3;
  transform: translateY(110%);
  visibility: hidden;
  transition: transform .3s var(--ease), visibility 0s linear .3s;
}

.sheet.is-open { transform: none; visibility: visible; transition: transform .3s var(--ease); }
.sheet-inner { display: flex; flex-direction: column; gap: 10px; max-width: 480px; margin: 0 auto; }
.sheet-pickers { display: flex; flex-direction: column; gap: 10px; }
.sheet.is-typing .sheet-pickers { height: 0; overflow: hidden; visibility: hidden; } /* folded, wheels keep their place */

.sheet-text {
  width: 100%;
  height: 48px;
  margin: 0;
  padding: 0 14px;
  border: 1px solid #cbbba8;
  border-radius: 12px;
  background: #fffaf3;
  color: var(--ink);
  font: 17px/1.2 var(--font-ui);
  -webkit-appearance: none;
  appearance: none;
}

.sheet-text::placeholder { color: var(--muted); opacity: 1; }
.sheet-cols { display: grid; gap: 6px; padding: 0 8px; }
.sheet-labels { font-size: 13px; color: var(--muted); text-align: center; }
.sheet-labels .is-left { padding-left: 4px; text-align: left; }
.wheels { position: relative; }

.wheels-band { /* highlights the picked row across all wheels */
  position: absolute;
  top: calc(var(--wheel-item) * 2);
  right: 0;
  left: 0;
  height: var(--wheel-item);
  border-radius: 9px;
  background: var(--band);
  pointer-events: none;
}

.wheel {
  position: relative;
  height: calc(var(--wheel-item) * 5);
  overflow-x: hidden;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  overscroll-behavior: contain;
  scrollbar-width: none;
  touch-action: pan-y;
  border-radius: 9px;
  font-size: 19px;
  cursor: grab;
}

.wheel::-webkit-scrollbar { display: none; }
.wheel.is-dragging { scroll-snap-type: none; cursor: grabbing; }
.wheel:focus-visible { outline-offset: 0; }
.wheel-pad { height: calc(var(--wheel-item) * 2); }

.wheel-item {
  height: var(--wheel-item);
  overflow: hidden;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  line-height: var(--wheel-item);
  text-align: center;
  text-overflow: ellipsis;
  white-space: nowrap;
  scroll-snap-align: center;
  transform-origin: center;
}

.wheel-item.is-current, .wheel.is-measuring .wheel-item { color: var(--ink); font-weight: 600; }
.wheel--left .wheel-item { padding-left: 4px; text-align: left; transform-origin: left center; }

.sheet-action {
  height: 56px;
  border-radius: 14px;
  background: var(--pen);
  color: #fff;
  font: 600 17px/1 var(--font-ui);
}

.sheet-action:active { opacity: .85; }
.sheet-cancel { height: 48px; margin-bottom: -12px; color: var(--pen); font: 600 17px/1 var(--font-ui); }
.sheet-info { display: flex; flex-direction: column; gap: 4px; padding: 4px 8px 6px; font-size: 15px; line-height: 22px; }
.sheet-info h3 { margin: 0 0 4px; font: 600 17px/22px var(--font-ui); overflow-wrap: anywhere; }
.sheet-info p:last-child { margin-top: 6px; }
.is-muted { color: var(--muted); }

/* 9. Settings -------------------------------------------------------------- */
.section-title { height: var(--line); font-weight: 700; }
.title-row { display: flex; align-items: center; gap: 2px; height: var(--line); font-weight: 700; }

.back-btn {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  margin-left: -14px;
  border-radius: 12px;
  color: var(--pen);
}

.text-btn {
  display: block;
  height: var(--line);
  color: var(--pen);
  font-size: 24px;
  text-align: left;
  text-decoration: underline;
  text-underline-offset: 5px;
}

/* 10. Statistics ----------------------------------------------------------- */
.stat-line { display: flex; align-items: baseline; gap: 14px; min-height: var(--line); }
.is-small { font-size: 22px; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); height: var(--line); text-align: center; }

.stat-link {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  height: var(--line);
  color: var(--pen);
  text-align: left;
}

.month-nav { display: flex; align-items: center; height: var(--line); font-weight: 700; }
.month-name { flex: 1 1 0; text-align: center; }
.month-arrow { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; color: var(--pen); }
.month-arrow:first-child { margin-left: -10px; }
.month-arrow:last-child { margin-right: -10px; }

.chart { position: relative; } /* the ruled lines are its grid; the view sets its height */
.chart svg { position: absolute; top: 0; left: 0; }
.axis { position: absolute; left: 0; color: var(--pencil); font-size: 20px; line-height: 36px; }
.x-labels { position: relative; height: var(--line); color: var(--pencil); font-size: 20px; line-height: 36px; white-space: nowrap; }
.x-labels span { position: absolute; top: 0; transform: translateX(-50%); }

/* 11. Undo toast ----------------------------------------------------------- */
.toast {
  position: fixed;
  z-index: 30;
  bottom: calc(24px + var(--safe-bottom));
  left: 50%;
  display: flex;
  align-items: center;
  gap: 4px;
  height: 48px;
  padding: 0 4px 0 18px;
  border-radius: 24px;
  background: #1c1c1e;
  color: #fff;
  font: 15px/1 var(--font-ui);
  white-space: nowrap;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .25);
  transform: translate(-50%, calc(100% + 40px));
  visibility: hidden;
  transition: transform .25s var(--ease), visibility 0s linear .25s;
}

.toast.is-visible { transform: translate(-50%, 0); visibility: visible; transition: transform .25s var(--ease); }
.toast.is-plain { padding-right: 18px; }
.toast button { height: 44px; padding: 0 14px; border-radius: 22px; color: #a9c1ff; font-weight: 600; }

/* 12. Reduced motion ------------------------------------------------------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: .01ms !important;
    animation-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>
<body>

<main id="notebook" aria-label="Notebook">
  <div class="page">
    <div id="lines" class="bleed" role="list" aria-label="Notebook lines"></div>
    <div id="addArea" class="bleed">
      <div id="rowNext" class="add-row"></div>
      <div id="rowDate" class="add-row"></div>
    </div>
    <div id="notebookFiller" class="filler"></div>
  </div>
</main>

<section id="settings" aria-labelledby="settingsTitle" hidden>
  <div class="page">
    <div class="title-row">
      <button class="back-btn" type="button" data-back="notebook" aria-label="Back to the notebook">
        <svg width="14" height="24" viewBox="0 0 14 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M11 3l-8 9 8 9"/></svg>
      </button>
      <h1 id="settingsTitle">Settings</h1>
    </div>
    <div class="blank" aria-hidden="true"></div>
    <h2 class="section-title">machines</h2>
    <div id="machineList" class="bleed" role="list" aria-label="Machines"></div>
    <div id="addMachineRow" class="bleed add-row add-row--pencil"></div>
    <div class="blank" aria-hidden="true"></div>
    <h2 class="section-title">backup</h2>
    <button id="exportBtn" class="stat-link" type="button"><span>export to a file</span><svg width="12" height="22" viewBox="0 0 12 22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M2 3l8 8-8 8"/></svg></button>
    <button id="importBtn" class="stat-link" type="button"><span>import from a file</span><svg width="12" height="22" viewBox="0 0 12 22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M2 3l8 8-8 8"/></svg></button>
    <input id="importFile" type="file" accept="application/json,.json" aria-label="Backup file to import" hidden>
    <div class="blank" aria-hidden="true"></div>
    <button id="removeExamples" class="text-btn" type="button" hidden>remove the example lines</button>
    <div class="filler" aria-hidden="true"></div>
  </div>
</section>

<section id="stats" aria-labelledby="statsTitle" hidden>
  <div class="page">
    <div class="title-row">
      <button class="back-btn" type="button" data-back="notebook" aria-label="Back to the notebook">
        <svg width="14" height="24" viewBox="0 0 14 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M11 3l-8 9 8 9"/></svg>
      </button>
      <h1 id="statsTitle">Statistics</h1>
    </div>
    <div class="blank" aria-hidden="true"></div>
    <div id="statsBody"></div>
    <div class="filler" aria-hidden="true"></div>
  </div>
</section>

<section id="machineStats" aria-labelledby="machineStatsTitle" hidden>
  <div class="page">
    <div class="title-row">
      <button class="back-btn" type="button" data-back="stats" aria-label="Back to statistics">
        <svg width="14" height="24" viewBox="0 0 14 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M11 3l-8 9 8 9"/></svg>
      </button>
      <h1 id="machineStatsTitle">Machine</h1>
    </div>
    <div class="blank" aria-hidden="true"></div>
    <div id="machineStatsBody"></div>
    <div class="filler" aria-hidden="true"></div>
  </div>
</section>

<div class="topbar" aria-hidden="true"></div>

<button id="statsBtn" class="cog stats-btn" type="button" aria-label="Statistics">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 20h18M6 16v-4M12 16V6M18 16V9"/></svg>
</button>

<button id="cogBtn" class="cog" type="button" aria-label="Settings">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10.12 4.64L10.48 1.91A10.2 10.2 0 0 1 13.52 1.91L13.88 4.64A7.6 7.6 0 0 1 15.88 5.46L18.05 3.79A10.2 10.2 0 0 1 20.21 5.95L18.54 8.12A7.6 7.6 0 0 1 19.36 10.12L22.09 10.48A10.2 10.2 0 0 1 22.09 13.52L19.36 13.88A7.6 7.6 0 0 1 18.54 15.88L20.21 18.05A10.2 10.2 0 0 1 18.05 20.21L15.88 18.54A7.6 7.6 0 0 1 13.88 19.36L13.52 22.09A10.2 10.2 0 0 1 10.48 22.09L10.12 19.36A7.6 7.6 0 0 1 8.12 18.54L5.95 20.21A10.2 10.2 0 0 1 3.79 18.05L5.46 15.88A7.6 7.6 0 0 1 4.64 13.88L1.91 13.52A10.2 10.2 0 0 1 1.91 10.48L4.64 10.12A7.6 7.6 0 0 1 5.46 8.12L3.79 5.95A10.2 10.2 0 0 1 5.95 3.79L8.12 5.46A7.6 7.6 0 0 1 10.12 4.64Z"/><circle cx="12" cy="12" r="3"/></svg>
</button>

<button id="todayBtn" class="today" type="button" aria-label="Back to today">
  <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M11 3v15M4 12l7 7 7-7"/></svg>
</button>

<div id="backdrop" class="backdrop" hidden></div>

<div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-inner">
    <h2 id="sheetTitle" class="visually-hidden">Log a line</h2>
    <div id="sheetInfo" class="sheet-info" hidden></div>
    <div class="sheet-pickers">
      <div id="sheetLabels" class="sheet-cols sheet-labels" aria-hidden="true"></div>
      <div class="wheels">
        <div class="wheels-band" aria-hidden="true"></div>
        <div id="sheetWheels" class="sheet-cols"></div>
      </div>
    </div>
    <input id="sheetText" class="sheet-text" type="text" autocomplete="off" autocapitalize="sentences" enterkeyhint="done" aria-label="Write your own line" hidden>
    <button id="sheetAction" class="sheet-action" type="button">Log</button>
    <button id="sheetCancel" class="sheet-cancel" type="button" hidden>Cancel</button>

<script data-module="notebook" data-testable>
/**
 * The notebook's rules. Pure functions: they take lines and return answers,
 * and never touch the page or storage.
 *
 * Data shape
 *   machines: [{ id, name }]
 *   lines:    [{ id, type: 'date', date }      date = "YYYY-MM-DD"
 *              { id, type: 'text', text }
 *              { id, type: 'machine', machineId, name, weight, sets, reps }]

      if (line.type === 'date') days.push({ date: line.date, order, lines: [] });
      else if (days.length) days[days.length - 1].lines.push(line);
      else undated.push(line);

  /** How a weight compares with last time: 'up', 'down', or how many times in a row it stayed the same. */
  function markFor(weight, previous) {

    if (weight > previous.weight) return { mark: 'up', repeats: 0 };
    if (weight < previous.weight) return { mark: 'down', repeats: 0 };
    const repeats = previous.repeats + 1;
    return { mark: repeats, repeats };
  }

  /**
   * Compares every machine line with the previous time on that machine, in date order.
   *   marks:  line id → 'up' (heavier), 'down' (lighter), a number (same weight, times in a row) or null (first time)
   *   latest: machine id → { weight, sets, reps, repeats } of the most recent time
   */

    const marks = new Map();
    const latest = new Map();
    for (const line of linesInDateOrder(lines)) {
      if (line.type !== 'machine') continue;
      const { mark, repeats } = markFor(line.weight, latest.get(line.machineId));
      latest.set(line.machineId, { weight: line.weight, sets: line.sets, reps: line.reps, repeats });
      marks.set(line.id, mark);

    const max = Math.max(KG_MAX, value);

    for (let i = 0; round2(i * KG_STEP) <= max; i++) options.push(round2(i * KG_STEP));

      options.sort((a, b) => a - b);

      .filter((line) => !line.example || keepDates.has(line.id))

      { id: 'm-chest-press', name: 'Chest press' },
      { id: 'm-lat-pulldown', name: 'Lat pulldown' },
      { id: 'm-shoulder-press', name: 'Shoulder press' },
      { id: 'm-seated-row', name: 'Seated row' },
      { id: 'm-leg-curl', name: 'Leg curl' },
    ];
    const byName = new Map(machines.map((m) => [m.name, m]));

      ['2026-11-07', 'Biking Basics New Zealand #11', [['Leg press', 75, 3, 12], ['Chest press', 32.5, 3, 10], ['Seated row', 37.5, 3, 12]]],
      ['2026-11-09', 'Biking Basics New Zealand #12', [['Leg press', 75, 3, 12], ['Shoulder press', 20, 3, 10], ['Lat pulldown', 45, 3, 12]]],
      ['2026-11-11', 'Biking Basics New Zealand #13', [['Chest press', 32.5, 3, 10], ['Shoulder press', 20, 3, 10], ['Seated row', 40, 3, 12]]],
      ['2026-11-14', 'Biking Basics New Zealand #14', [['Leg press', 75, 3, 12], ['Chest press', 35, 3, 10], ['Lat pulldown', 45, 3, 12]]],
      ['2026-11-16', 'Biking Basics New Zealand #15', [['Leg press', 80, 3, 12], ['Shoulder press', 20, 3, 10], ['Seated row', 40, 3, 12]]],

<script data-module="backup" data-testable>
/**
 * Backup: turning a notebook into a JSON file and back. Pure functions.
 *
 * File shape
 *   { "app": "fitness-notebook", "version": 1, "exportedAt": "<ISO time>", "unit": "kg",
 *     "machines": [{ id, name }],
 *     "lines": [{ id, type: "date", date } | { id, type: "text", text } |
 *               { id, type: "machine", machineId, name, weight, sets, reps }] }
 * Rules for reading a file
 *   - it must say app "fitness-notebook"; anything else is refused
 *   - a newer version than this app knows is refused, never half-read
 *   - fields this app does not know are ignored, so later versions can add things
 */
(function (FN) {
  'use strict';
  const { cleanName, newId } = FN.util;
  const { Dates } = FN.dates;

  const BACKUP_APP = 'fitness-notebook';
  const BACKUP_VERSION = 1;

  /** The name of a backup file made on `today` ("YYYY-MM-DD"). */
  function backupFileName(today) {
    return `fitness-notebook-${today}.json`;
  }

  /** A machine with only the fields this app knows, or null when it cannot be used. */
  function cleanMachine(machine) {
    if (!machine || typeof machine.id !== 'string' || typeof machine.name !== 'string' || !cleanName(machine.name)) return null;
    return { id: machine.id, name: cleanName(machine.name) };
  }

  /** A line with only the fields this app knows, or null when it cannot be used. */
  function cleanLine(line) {
    if (!line) return null;
    const id = typeof line.id === 'string' && line.id ? line.id : newId('l');
    const isCount = (n) => Number.isFinite(n) && n >= 0;
    if (line.type === 'date' && /^\d{4}-\d{2}-\d{2}$/.test(line.date)) return { id, type: 'date', date: line.date };
    if (line.type === 'text' && typeof line.text === 'string' && line.text.trim()) return { id, type: 'text', text: line.text.trim() };
    if (
      line.type === 'machine' &&
      typeof line.machineId === 'string' &&
      typeof line.name === 'string' &&
      isCount(line.weight) && isCount(line.sets) && isCount(line.reps)
    ) {
      const { machineId, name, weight, sets, reps } = line;
      return { id, type: 'machine', machineId, name, weight, sets, reps };
    }
    return null;
  }

  /** The notebook as a backup object. `now` is the Date of the export. */
  function toBackup(notebook, now) {
    return {
      app: BACKUP_APP,
      version: BACKUP_VERSION,
      exportedAt: now.toISOString(),
      unit: 'kg',
      machines: notebook.machines.map(cleanMachine).filter(Boolean),
      lines: notebook.lines.map(cleanLine).filter(Boolean),
    };
  }

  /** The notebook as the text of a backup file. */
  function toBackupJson(notebook, now) {
    return JSON.stringify(toBackup(notebook, now), null, 2);
  }

  /** Reads the text of a backup file. Returns { notebook } or { error }. */
  function parseBackup(text) {
    let file;
    try {
      file = JSON.parse(text);
    } catch (_) {
      return { error: 'That is not a JSON file' };
    }
    if (!file || file.app !== BACKUP_APP || !Array.isArray(file.machines) || !Array.isArray(file.lines)) {
      return { error: 'That is not a Fitness Notebook file' };
    }
    if (typeof file.version !== 'number' || file.version > BACKUP_VERSION) {
      return { error: 'That file is from a newer version of the app' };
    }
    return {
      notebook: {
        version: 1,
        machines: file.machines.map(cleanMachine).filter(Boolean),
        lines: file.lines.map(cleanLine).filter(Boolean),
      },
    };
  }

  /** A short description of a notebook, for the "replace?" question: [lines and dates, machines]. */
  function describeNotebook(notebook) {
    const dates = notebook.lines.filter((l) => l.type === 'date').map((l) => l.date).sort();
    const count = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
    let lines = count(notebook.lines.length, 'line');

<script data-module="stats" data-testable>
/**
 * The numbers behind the statistics screens. Pure functions:
 * they take lines and dates and return plain values the view can draw.
 */
(function (FN) {
  'use strict';
  const { round2, clamp } = FN.util;
  const { Dates } = FN.dates;

  /* ---- Sessions and months ---- */

  /** The dates that have a date line in the notebook, as a Set of "YYYY-MM-DD". */

        onTap(row, row);
      } else if (e.key === 'Delete' || e.key === 'Backspace') {
        e.preventDefault();
        removeRow(row);
      }
    });

    return { closeOpenRow };
  }

  FN.rowGestures = { createRowGestures };
})(globalThis.FN = globalThis.FN || {});
</script>

<script data-module="notebookView">
/** The notebook screen: the lines, adding a line, starting a date, removing. */
(function (FN) {
  'use strict';
  const { SETS, REPS, FIRST_TIME_VALUES, YEARS_BACK, PREVIEW_ID, BLANK_ROW, Icons } = FN.config;
  const { range, round2, formatKg, newId, indexOr, escapeHtml } = FN.util;
  const { byId, scrollToBottom } = FN.dom;
  const { Dates } = FN.dates;
  const { state, save, machinesAZ } = FN.state;
  const { analyzeLines, machinesInCurrentDay, kgOptions } = FN.notebook;
  const { createRowGestures } = FN.rowGestures;
  const { Sheet } = FN.sheet;
  const { Toast } = FN.toast;

  const NotebookView = (() => {
    const root = byId('notebook');
    const linesEl = byId('lines');
    const addArea = byId('addArea');
    const rowNext = byId('rowNext');
    const rowDate = byId('rowDate');
    const filler = byId('notebookFiller');
    const todayBtn = byId('todayBtn');

    let busy = false; // a sheet is open

    /* ---- Markup ---- */

    function markHtml(mark) {
      if (mark === 'up') return `<span class="mark" role="img" aria-label="heavier than last time">${Icons.up}</span>`;
      if (mark === 'down') return `<span class="mark" role="img" aria-label="lighter than last time">${Icons.down}</span>`;
      if (typeof mark === 'number') {
        return `<span class="mark" role="img" aria-label="same weight, ${mark} ${mark === 1 ? 'time' : 'times'} in a row">–${mark}</span>`;
      }
      return '';
    }

    function contentHtml(line, mark) {
      if (line.type === 'date') {
        const { date, day } = Dates.written(line.date);
        return `<span>${date}</span><span>${day}</span>`;
      }
      if (line.type === 'text') return escapeHtml(line.text);
      return (
        `<span class="name">${escapeHtml(line.name)}</span>` +
        `<span class="nums">${formatKg(line.weight)} × ${Number(line.sets)} × ${Number(line.reps)}</span>` +
        markHtml(mark)
      );
    }

    function rowHtml(line, mark) {
      return (
        `<div class="row row--${line.type}" role="listitem" tabindex="0" data-key="${escapeHtml(line.id)}">` +
        `<div class="row-content">${contentHtml(line, mark)}</div>` +
        '<button class="row-delete" type="button" tabindex="-1" aria-label="Delete line"><span>Delete</span></button>' +
        '</div>'
      );
    }

    function render() {
      const { marks } = analyzeLines(state.data.lines);
      linesEl.innerHTML = state.data.lines
        .map((line, i) => (line.type === 'date' && i > 0 ? BLANK_ROW : '') + rowHtml(line, marks.get(line.id)))
        .join('');
      showAddLines();
      filler.style.height = '';
      updateTodayButton();
    }

    /* ---- The lines under the last entry ----
       First empty line: tap to add a line. Anywhere below it: tap to start a new date. */

    function showAddLines() {
      const empty = state.data.lines.length === 0; // a fresh notebook starts with a date
      rowNext.hidden = empty;
      setButton(rowNext, 'line', 'tap to add a line');
      setButton(rowDate, 'date', empty ? 'tap to start with a date' : '', 'Start a new date');
    }

    function setButton(row, action, text, label) {
      row.className = 'add-row';
      row.innerHTML =
        `<button class="add-btn is-pencil" type="button" data-action="${action}"` +
        `${label ? ` aria-label="${label}"` : ''}>${text}</button>`;
    }

    function setRowContent(row, html, className = '') {
      row.className = 'add-row';
      row.innerHTML = `<div class="row-content ${className}">${html}</div>`;
    }

    function clearRow(row) {
      row.className = 'add-row';
      row.innerHTML = '';
    }

    function rowFor(line) {
      return linesEl.querySelector(`.row[data-key="${CSS.escape(line.id)}"]`);
    }

    /** Shows a pencil preview in the row of the line that is being changed. */
    function showInRow(line, type, html) {
      const row = rowFor(line);
      if (!row) return;
      row.className = `row row--${type}`;
      const content = row.querySelector('.row-content');
      content.classList.add('is-pencil');
      content.innerHTML = html;
    }

    /** Leaves room under the page and scrolls so `target` stays visible above the sheet. */
    function makeRoomFor(target) {
      const sheetHeight = Sheet.height();
      filler.style.height = `calc(var(--line) * 4 + ${sheetHeight}px)`;
      if (!target) return;
      const limit = window.innerHeight - sheetHeight - 16;
      const bottom = target.getBoundingClientRect().bottom;
      if (bottom > limit) window.scrollBy({ top: bottom - limit, behavior: 'smooth' });
    }

    function finish({ scroll } = {}) {
      busy = false;
      render();
      if (scroll) scrollToBottom(true);
    }

    /* ---- Add or change a line: machine wheels, or your own text ---- */

    function openLineSheet(editing) {
      const editingMachine = editing && editing.type === 'machine' ? editing : null;
      const machines = machinesAZ();
      if (editingMachine && !machines.some((m) => m.id === editingMachine.machineId)) {
        // The machine was removed in settings; keep it pickable for this line.
        machines.unshift({ id: editingMachine.machineId, name: editingMachine.name });
      }
      const hasWheels = machines.length > 0;
      const { latest } = analyzeLines(state.data.lines);
      const lastTime = (machine) => latest.get(machine.id) || FIRST_TIME_VALUES;

      let machineIndex = 0;
      if (editingMachine) {
        machineIndex = machines.findIndex((m) => m.id === editingMachine.machineId);
      } else if (hasWheels) {
        const done = machinesInCurrentDay(state.data.lines);
        machineIndex = Math.max(0, machines.findIndex((m) => !done.has(m.id)));
      }
      let settledIndex = machineIndex;
      const start = editingMachine || (hasWheels ? lastTime(machines[machineIndex]) : FIRST_TIME_VALUES);
      let kgList = kgOptions(start.weight);
      let wheels = null;

      const wheelValues = () => ({ weight: kgList[wheels[1].index], sets: SETS[wheels[2].index], reps: REPS[wheels[3].index] });

      /** What the button would write: a text line when something is typed, else a machine line. */
      function fields() {
        const text = Sheet.text();
        if (text) return { type: 'text', text };
        if (!hasWheels) return null;
        const machine = machines[wheels[0].index];
        // While the machine wheel is still moving, show the numbers it will fill in.
        const moving = !editingMachine && wheels[0].index !== settledIndex;
        const { weight, sets, reps } = moving ? lastTime(machine) : wheelValues();
        const keepName = editingMachine && machine.id === editingMachine.machineId; // old lines keep their written name
        return { type: 'machine', machineId: machine.id, name: keepName ? editingMachine.name : machine.name, weight, sets, reps };
      }

      function preview() {
        if (!wheels) return;
        const next = fields();
        let type = 'text';
        let html = '';
        if (next) {
          const line = { id: editing ? editing.id : PREVIEW_ID, ...next };
          const lines = editing ? state.data.lines.map((l) => (l === editing ? line : l)) : state.data.lines.concat(line);
          type = line.type;
          html = contentHtml(line, analyzeLines(lines).marks.get(line.id));
        }
        if (editing) {
          showInRow(editing, type, html);
        } else {
          setRowContent(rowNext, html, type === 'text' ? 'is-pencil is-text' : 'is-pencil');
          clearRow(rowDate);
        }
      }

      /** When the machine wheel stops on a new machine, load that machine's numbers. */
      function followMachine() {
        const index = wheels[0].index;
        if (index === settledIndex) return;
        settledIndex = index;
        const values = editingMachine ? wheelValues() : lastTime(machines[index]);
        kgList = kgOptions(values.weight);
        wheels[1].setItems(kgList.map(formatKg), indexOr(kgList, round2(values.weight)));
        wheels[2].setIndex(indexOr(SETS, values.sets, 2), false);
        wheels[3].setIndex(indexOr(REPS, values.reps, 11), false);
        preview();
      }

      function commitLine() {
        const next = fields();
        if (next) {
          if (editing) state.data.lines[state.data.lines.indexOf(editing)] = { id: editing.id, ...next };
          else state.data.lines.push({ id: newId('l'), ...next });
          save();
        }
        finish({ scroll: !editing && !!next });
      }

      busy = true;
      wheels = Sheet.open({
        title: editing ? 'Change this line' : 'Add a line',
        text: {
          value: editing && editing.type === 'text' ? editing.text : '',
          placeholder: hasWheels ? 'or write your own line' : 'write a line',
        },
        columns: 'minmax(0, 1fr) 56px 40px 40px',
        labels: [{ text: 'Machine', left: true }, { text: 'kg' }, { text: 'sets' }, { text: 'reps' }],
        wheels: hasWheels
          ? [
              { label: 'Machine', align: 'left', items: machines.map((m) => m.name), index: machineIndex },
              { label: 'Weight in kg', items: kgList.map(formatKg), index: indexOr(kgList, round2(start.weight)) },
              { label: 'Sets', items: SETS.map(String), index: indexOr(SETS, start.sets, 2) },
              { label: 'Reps', items: REPS.map(String), index: indexOr(REPS, start.reps, 11) },
            ]
          : [],
        actionLabel: editing ? 'Save' : 'Log',
        onChange: preview,
        onSettle: (i) => { if (i === 0) followMachine(); },
        onAction: commitLine,
        onCancel: () => finish(),
      });
      preview();
      makeRoomFor(editing ? rowFor(editing) : rowNext);
    }

    /* ---- Date lines ---- */

    function openDateSheet(editing) {
      const today = Dates.today();
      const now = Dates.parts(today);
      const start = Dates.parts(editing ? editing.date : today);
      const writtenYears = state.data.lines.filter((l) => l.type === 'date').map((l) => Dates.parts(l.date).y);
      const years = range(Math.min(now.y - YEARS_BACK, start.y, ...writtenYears), Math.max(now.y, start.y));
      const days = range(1, 31);
      const months = range(1, 12);
      let wheels = null;

      /** The picked date, made valid: no 31 November, nothing after today. */
      function picked() {
        const y = years[wheels[2].index];
        const m = months[wheels[1].index];
        const d = Math.min(days[wheels[0].index], Dates.daysInMonth(y, m));
        const iso = Dates.toIso(y, m, d);
        return iso > today ? today : iso;
      }

      function snapToValid() {
        const { y, m, d } = Dates.parts(picked());
        if (wheels[0].index !== d - 1) wheels[0].setIndex(d - 1, true);
        if (wheels[1].index !== m - 1) wheels[1].setIndex(m - 1, true);
        const yearIndex = years.indexOf(y);
        if (wheels[2].index !== yearIndex) wheels[2].setIndex(yearIndex, true);
      }

      function preview() {
        if (!wheels) return;
        const html = contentHtml({ type: 'date', date: picked() });
        if (editing) {
          showInRow(editing, 'date', html);
        } else {
          clearRow(rowNext); // this becomes the skipped line
          setRowContent(rowDate, html, 'is-pencil is-bold');
        }
      }

      function commitDate() {
        const date = picked();
        if (editing) state.data.lines[state.data.lines.indexOf(editing)] = { id: editing.id, type: 'date', date };
        else state.data.lines.push({ id: newId('l'), type: 'date', date });
        save();
        finish({ scroll: !editing });
      }

      busy = true;
      wheels = Sheet.open({
        title: editing ? 'Change the date' : 'Start a new date',
        columns: '64px 64px 84px',
        center: true,
        labels: [{ text: 'day' }, { text: 'month' }, { text: 'year' }],
        wheels: [
          { label: 'Day', items: days.map(String), index: start.d - 1 },
          { label: 'Month', items: months.map(String), index: start.m - 1 },
          { label: 'Year', items: years.map(String), index: indexOr(years, start.y, years.length - 1) },
        ],
        actionLabel: editing ? 'Save' : 'Log',
        onChange: preview,
        onSettle: snapToValid,
        onAction: commitDate,
        onCancel: () => finish(),
      });
      preview();
      makeRoomFor(editing ? rowFor(editing) : rowDate);
    }

    /* ---- Removing ---- */

    function removeLine(id) {
      const index = state.data.lines.findIndex((l) => l.id === id);
      if (index === -1) return;
      const [line] = state.data.lines.splice(index, 1);
      save();
      render();
      Toast.show(line.type === 'date' ? 'Date removed' : 'Line removed', () => {
        state.data.lines.splice(Math.min(index, state.data.lines.length), 0, line);
        save();
        render();
      });
    }

    /* ---- Back to today ---- */

    function updateTodayButton() {
      const away = !root.hidden && !Sheet.isOpen() && addArea.getBoundingClientRect().top > window.innerHeight;
      todayBtn.classList.toggle('is-visible', away);
    }

    /* ---- Events ---- */

    addArea.addEventListener('click', (e) => {
      const button = e.target.closest('[data-action]');
      if (!button || busy) return;
      if (button.dataset.action === 'line') openLineSheet(null);
      else openDateSheet(null);
    });

    // The empty paper below the add line also starts a new date.
    filler.addEventListener('click', () => {
      if (!busy) openDateSheet(null);
    });

    createRowGestures(linesEl, {
      onTap(row) {
        const line = state.data.lines.find((l) => l.id === row.dataset.key);
        if (!line || busy) return;
        if (line.type === 'date') openDateSheet(line);
        else openLineSheet(line);
      },
      onDelete: (row) => removeLine(row.dataset.key),
    });

    todayBtn.addEventListener('click', () => scrollToBottom(true));

    return { render, updateTodayButton };
  })();

  FN.notebookView = { NotebookView };
})(globalThis.FN = globalThis.FN || {});
</script>

<script data-module="settingsView">
/** The settings screen: the machines list and the backup. */
(function (FN) {
  'use strict';
  const { cleanName, sameName, newId, escapeHtml } = FN.util;
  const { byId, shake, downloadFile } = FN.dom;
  const { Dates } = FN.dates;
  const { state, save, machinesAZ } = FN.state;
  const { withoutExamples } = FN.notebook;
  const { backupFileName, toBackupJson, parseBackup, describeNotebook } = FN.backup;
  const { navigation } = FN.navigation;
  const { createLineInput } = FN.lineInput;
  const { createRowGestures } = FN.rowGestures;
  const { Sheet } = FN.sheet;
  const { Toast } = FN.toast;

  const SettingsView = (() => {
    const list = byId('machineList');
    const addRow = byId('addMachineRow');
    const examplesBtn = byId('removeExamples');
    const importFile = byId('importFile');

    function render() {
      renderList();
      renderAddRow();
      examplesBtn.hidden = !state.data.lines.some((l) => l.example);
    }

    function renderList() {
      list.innerHTML = machinesAZ()
        .map((m) => {
          const name = escapeHtml(m.name);
          return (
            `<div class="row row--machine" role="listitem" tabindex="0" data-key="${escapeHtml(m.id)}">` +
            `<div class="row-content"><span class="name">${name}</span></div>` +
            `<button class="row-delete" type="button" tabindex="-1" aria-label="Remove ${name}"><span>Delete</span></button>` +
            '</div>'
          );
        })
        .join('');
    }

    function renderAddRow() {
      addRow.className = 'bleed add-row add-row--pencil';
      addRow.innerHTML = '<button class="pencil-btn" type="button">tap here to add a machine</button>';
    }

    const nameTaken = (name, exceptId) => state.data.machines.some((m) => m.id !== exceptId && sameName(m.name, name));

    function addMachine(name) {
      const clean = cleanName(name);
      // Re-adding a machine that was removed earlier picks its history back up.
      let oldId = null;
      for (let i = state.data.lines.length - 1; i >= 0 && !oldId; i--) {
        const l = state.data.lines[i];
        if (l.type === 'machine' && sameName(l.name, clean) && !state.data.machines.some((m) => m.id === l.machineId)) oldId = l.machineId;
      }
      state.data.machines.push({ id: oldId || newId('m'), name: clean });
      save();
      renderList();
    }

    function startAdding() {
      addRow.className = 'bleed add-row';
      addRow.innerHTML = '<div class="row-content"></div>';
      const input = createLineInput({
        placeholder: 'machine name',
        label: 'New machine',
        onSubmit(name, field) {
          if (!name) return 'close';
          if (nameTaken(name)) {
            shake(field);
            return 'keep';
          }
          addMachine(name);
          return 'clear'; // ready for the next one
        },
        onClose: renderAddRow,
      });
      addRow.firstElementChild.appendChild(input);
      input.focus();
    }

    function rename(row) {
      const machine = state.data.machines.find((m) => m.id === row.dataset.key);
      if (!machine) return;
      const input = createLineInput({
        value: machine.name,
        label: 'Machine name',
        onSubmit(name, field) {
          if (!name || name === machine.name) return 'close';
          if (nameTaken(name, machine.id)) {
            shake(field);
            return 'keep';
          }
          machine.name = cleanName(name);
          save();
          return 'close';
        },
        onClose: renderList,
      });
      row.querySelector('.name').replaceWith(input);
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
    }

    function removeMachine(id) {
      const index = state.data.machines.findIndex((m) => m.id === id);
      if (index === -1) return;
      const [machine] = state.data.machines.splice(index, 1);
      save();
      renderList();
      Toast.show('Machine removed', () => {
        state.data.machines.splice(Math.min(index, state.data.machines.length), 0, machine);
        save();
        renderList();
      });
    }

    addRow.addEventListener('click', (e) => {
      if (e.target.closest('.pencil-btn')) startAdding();
    });

    examplesBtn.addEventListener('click', () => {
      const before = state.data.lines;
      state.data.lines = withoutExamples(before);
      save();
      examplesBtn.hidden = true;
      Toast.show('Example lines removed', () => {
        state.data.lines = before;
        save();
        navigation.refresh();
      });
    });

    createRowGestures(list, {
      onTap: rename,
      onDelete: (row) => removeMachine(row.dataset.key),
    });

    /* ---- Backup ---- */

    byId('exportBtn').addEventListener('click', () => {
      const fileName = backupFileName(Dates.today());
      downloadFile(fileName, toBackupJson(state.data, new Date()));
      Toast.show(`Saved ${fileName}`);
    });

    byId('importBtn').addEventListener('click', () => importFile.click());

    importFile.addEventListener('change', () => {
      const file = importFile.files[0];
      importFile.value = ''; // so the same file can be picked again
      if (!file) return;
      const reader = new FileReader();
      reader.onerror = () => Toast.show('That file could not be read');
      reader.onload = () => {
        const { notebook, error } = parseBackup(String(reader.result));
        if (error) Toast.show(error);
        else askToReplace(file.name, notebook);
      };
      reader.readAsText(file);
    });

    /** Shows what is in the file and replaces the notebook only after a yes. */
    function askToReplace(fileName, notebook) {
      Sheet.open({
        title: 'Import a notebook',
        info: {
          heading: fileName,
          details: describeNotebook(notebook),
          note: 'This replaces the notebook and the machines on this phone.',
        },
        columns: 'none',
        labels: [],
        wheels: [],
        actionLabel: 'Replace my notebook',
        cancelLabel: 'Cancel',
        onAction() {
          const before = state.data;
          state.data = notebook;
          save();
          navigation.refresh();
          Toast.show('Notebook replaced', () => {
            state.data = before;
            save();
            navigation.refresh(); // you may have left Settings by now
          });
        },
      });
    }

    return { render };
  })();

  FN.settingsView = { SettingsView };
})(globalThis.FN = globalThis.FN || {});
</script>

<script data-module="statsView">
/** The statistics screens: one month at a time, and one machine over time. Drawing only; the numbers come from stats. */
(function (FN) {
  'use strict';
  const { DAY_NAMES, MONTH_NAMES, MONTH_SHORT, BLANK_ROW } = FN.config;
  const { formatKg, escapeHtml } = FN.util;
  const { byId } = FN.dom;
  const { Dates } = FN.dates;
  const { state, machinesAZ } = FN.state;
  const { navigation } = FN.navigation;
  const {
    sessionDates, monthParts, shiftMonth, monthRange, clampMonth, weeksInARow, monthCells, countTrained, inRows, tallyMarks,
    machineHistory, changeIndexes, weightChanges, chartScale, chartRows, axisValues, chartPoints, spacedOut, monthLabels,
  } = FN.stats;

  const monthBody = byId('statsBody');
  const machineTitle = byId('machineStatsTitle');
  const machineBody = byId('machineStatsBody');

  const MAX_CHART_ROWS = 5;   // ruled lines a chart may use as its grid
  const LINE_PX = 44;         // keep in sync with --line
  const RULE_Y = 36.5;        // where the ruled line sits inside a row
  const CHART_LEFT = 66;      // room for the kg written on the left
  const CHART_RIGHT_GAP = 28;
  const MAX_DOTS = 24;        // with more points, only the changes get a dot
  const MAX_DATE_LABELS = 5;  // with more changes, the chart shows months instead of dates
  const MAX_TALLY = 30;       // above this only the number is shown

  const icon = (width, path) =>
    `<svg width="${width}" height="22" viewBox="0 0 ${width} 22" fill="none" stroke="currentColor" stroke-width="2.4" ` +
    `stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="${path}"/></svg>`;
  const CHEVRON = icon(12, 'M2 3l8 8-8 8');
  const ARROW_LEFT = icon(24, 'M20 11H4M10 5l-6 6 6 6');
  const ARROW_RIGHT = icon(24, 'M4 11h16M14 5l6 6-6 6');

  /** The month on screen as "YYYY-MM"; null means this month. */
  let shownMonth = null;

  /* ---- One month ---- */

  function tallyHtml(count) {
    if (count < 1 || count > MAX_TALLY) return '';
    const { path, width } = tallyMarks(count);
    return (
      `<svg width="${width}" height="26" viewBox="0 0 ${width} 26" fill="none" stroke="currentColor" stroke-width="2.2" ` +
      `stroke-linecap="round" aria-hidden="true" focusable="false"><path d="${path}"/></svg>`
    );
  }

  function cellHtml(cell) {
    if (cell.state === 'trained') return `<span class="is-bold" role="img" aria-label="${cell.day}: trained">×</span>`;
    if (cell.state === 'rest') return '<span class="is-pencil" aria-hidden="true">·</span>';
    return '<span></span>';
  }

  function statLineHtml(label, count) {
    return `<div class="stat-line"><span>${label}</span>${tallyHtml(count)}<span class="mark">${count}</span></div>`;
  }

  /** An arrow to another month, or an empty spot of the same size when there is no month to go to. */
  function monthArrowHtml(direction, show) {
    if (!show) return '<span class="month-arrow" aria-hidden="true"></span>';
    const label = direction === 'prev' ? 'Month before' : 'Month after';
    return `<button class="month-arrow" type="button" data-month="${direction}" aria-label="${label}">${direction === 'prev' ? ARROW_LEFT : ARROW_RIGHT}</button>`;
  }

  function monthNavHtml(month, range) {
    const { y, m } = monthParts(month);
    const name = MONTH_NAMES[m - 1] + (y === new Date().getFullYear() ? '' : ` ${y}`);
    return (
      '<div class="month-nav">' +
      monthArrowHtml('prev', month > range.first) +
      `<span class="month-name" aria-live="polite">${name}</span>` +
      monthArrowHtml('next', month < range.last) +
      '</div>'
    );
  }

  function machineLinksHtml(machines) {
    if (!machines.length) return '<div class="stat-line is-pencil">no machines yet</div>';
    return machines
      .map((machine) => `<button class="stat-link" type="button" data-machine="${escapeHtml(machine.id)}"><span>${escapeHtml(machine.name)}</span>${CHEVRON}</button>`)
      .join('');
  }

  function renderMonth() {
    const today = Dates.today();
    const dates = sessionDates(state.data.lines);
    const range = monthRange(dates, today);
    shownMonth = clampMonth(shownMonth || range.last, range);
    const { y, m } = monthParts(shownMonth);
    const cells = monthCells(dates, y, m, today);
    const mondayFirst = DAY_NAMES.slice(1).concat(DAY_NAMES[0]);
    const isThisMonth = shownMonth === range.last;

    monthBody.innerHTML =
      monthNavHtml(shownMonth, range) +
      `<div class="week is-pencil is-small" aria-hidden="true">${mondayFirst.map((day) => `<span>${day}</span>`).join('')}</div>` +
      inRows(cells, 7).map((week) => `<div class="week">${week.map(cellHtml).join('')}</div>`).join('') +
      BLANK_ROW +
      statLineHtml('sessions', countTrained(cells)) +
      (isThisMonth ? statLineHtml('weeks in a row', weeksInARow(dates, today)) : '') + // a streak is about now
      BLANK_ROW +
      machineLinksHtml(machinesAZ());
  }

  /** Go back to this month the next time the screen is drawn. */
  function showThisMonth() {
    shownMonth = null;
  }

  /* ---- One machine over time ---- */

  /** What is written under the chart: a date under each change when they fit, else month names. */
  function xLabels(points, xy) {
    const changes = changeIndexes(points);
    if (changes.length <= MAX_DATE_LABELS && spacedOut(changes.map((i) => xy[i].x), 50)) {
      return changes.map((i) => ({ x: xy[i].x, text: Dates.written(points[i].date).date }));
    }
    const thisYear = new Date().getFullYear();
    return monthLabels(points, xy, 48).map((label, i) => ({
      x: label.x,
      text: MONTH_SHORT[label.month - 1] + (i === 0 && label.year !== thisYear ? ` '${String(label.year).slice(-2)}` : ''),
    }));
  }

  function chartHtml(name, points, width) {
    const weights = points.map((p) => p.weight);
    const scale = chartScale(weights, MAX_CHART_ROWS);
    const rows = chartRows(weights, scale, MAX_CHART_ROWS);
    const height = rows * LINE_PX;
    const xy = chartPoints(points, scale, { left: CHART_LEFT, right: width - CHART_RIGHT_GAP, firstLineY: RULE_Y, lineHeight: LINE_PX });
    const dots = points.length <= MAX_DOTS ? xy : changeIndexes(points).map((i) => xy[i]);
    const first = points[0];
    const last = points[points.length - 1];
    const label =
      `${escapeHtml(name)}: ${points.length} times, from ${formatKg(first.weight)} kg on ${Dates.written(first.date).date} ` +
      `to ${formatKg(last.weight)} kg on ${Dates.written(last.date).date}`;

    return (
      `<div class="chart" style="height: ${height}px">` +
      axisValues(scale, rows).map(({ row, value }, i) => `<span class="axis" style="top: ${row * LINE_PX}px">${formatKg(value)}${i === 0 ? ' kg' : ''}</span>`).join('') +
      `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" fill="none" role="img" aria-label="${label}">` +
      `<path d="M${xy.map((p) => `${p.x} ${p.y}`).join('L')}" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>` +
      `<g fill="currentColor">${dots.map((p) => `<circle cx="${p.x}" cy="${p.y}" r="4"/>`).join('')}</g>` +
      '</svg></div>' +
      `<div class="x-labels" aria-hidden="true">${xLabels(points, xy).map((l) => `<span style="left: ${l.x}px">${l.text}</span>`).join('')}</div>`
    );
  }

  /** The list under the chart: every time the weight was new, newest first. */
  function changesHtml(points) {
    const rows = weightChanges(points).reverse().map((change) => {
      const { date, day } = Dates.written(change.date);
      return `<div class="stat-line"><span>${date}</span><span>${day}</span><span class="mark">${formatKg(change.weight)} kg</span></div>`;
    });
    return BLANK_ROW + '<div class="stat-line is-pencil">when the weight changed</div>' + rows.join('');
  }

  function renderMachine(machineId) {
    const machine = state.data.machines.find((m) => m.id === machineId);
    const name = machine ? machine.name : 'Machine';
    machineTitle.textContent = name;
    const points = machineHistory(state.data.lines, machineId);
    machineBody.innerHTML = points.length
      ? chartHtml(name, points, machineBody.clientWidth || 326) + changesHtml(points)
      : '<div class="stat-line is-pencil">nothing logged yet</div>';
  }

  monthBody.addEventListener('click', (e) => {
    const arrow = e.target.closest('[data-month]');
    if (arrow) {
      shownMonth = shiftMonth(shownMonth, arrow.dataset.month === 'prev' ? -1 : 1);
      renderMonth();
      return;
    }
    const machine = e.target.closest('[data-machine]');
    if (machine) navigation.open({ view: 'machineStats', machineId: machine.dataset.machine });
  });

  const StatsView = { renderMonth, renderMachine, showThisMonth };

  FN.statsView = { StatsView };
})(globalThis.FN = globalThis.FN || {});
</script>

<script data-module="app">
/** Start-up and moving between the screens: notebook, settings, statistics, machine chart. */
(function (FN) {
  'use strict';
  const { STORAGE_KEY } = FN.config;
  const { byId, onNextFrame, scrollToBottom } = FN.dom;
  const { save, reload } = FN.state;
  const { navigation } = FN.navigation;
  const { Sheet } = FN.sheet;
  const { NotebookView } = FN.notebookView;
  const { SettingsView } = FN.settingsView;
  const { StatsView } = FN.statsView;

  const App = (() => {
    const views = {
      notebook: byId('notebook'),
      settings: byId('settings'),
      stats: byId('stats'),
      machineStats: byId('machineStats'),
    };
    const topButtons = [byId('cogBtn'), byId('statsBtn')];
    let current = { view: 'notebook' };
    let notebookScrollY = 0;

    /** Shows the view a current describes: { view, machineId }. */
    function show(next) {
      const target = next && views[next.view] ? next : { view: 'notebook' };
      Sheet.cancel();
      if (current.view === 'notebook' && target.view !== 'notebook') {
        notebookScrollY = window.scrollY;
        StatsView.showThisMonth();
      }
      current = target;
      for (const name of Object.keys(views)) views[name].hidden = name !== current.view;
      topButtons.forEach((button) => { button.hidden = current.view !== 'notebook'; });
      render();
      window.scrollTo(0, current.view === 'notebook' ? notebookScrollY : 0);
      NotebookView.updateTodayButton();
    }

    function render() {
      if (current.view === 'settings') SettingsView.render();
      else if (current.view === 'stats') StatsView.renderMonth();
      else if (current.view === 'machineStats') StatsView.renderMachine(current.machineId);
      else NotebookView.render();
    }

    function open(next) {
      try {
        history.pushState(next, '');
      } catch (_) {
        /* history not available (sandboxed frame): the back arrows still work */
      }
      show(next);
    }

    function back(fallbackView) {
      const pushed = history.state && history.state.view === current.view && current.view !== 'notebook';
      if (pushed) history.back(); // popstate shows the view underneath
      else show({ view: fallbackView });
    }

    byId('cogBtn').addEventListener('click', () => open({ view: 'settings' }));
    byId('statsBtn').addEventListener('click', () => open({ view: 'stats' }));
    document.querySelectorAll('[data-back]').forEach((button) => {
      button.addEventListener('click', () => back(button.dataset.back));
    });
    window.addEventListener('popstate', (e) => show(e.state));

    function start() {
      try {
        history.scrollRestoration = 'manual';
        history.replaceState({ view: 'notebook' }, '');
      } catch (_) {
        /* not available: fine */
      }
      save();
      NotebookView.render();
      scrollToBottom(false);
      if (document.fonts && document.fonts.ready) {
        const y = window.scrollY;
        document.fonts.ready.then(() => { if (current.view === 'notebook' && window.scrollY === y) scrollToBottom(false); });
      }

      const refreshTodayButton = onNextFrame(NotebookView.updateTodayButton);
      window.addEventListener('scroll', refreshTodayButton, { passive: true });
      window.addEventListener('resize', () => {
        refreshTodayButton();
        if (current.view === 'machineStats') render(); // the chart follows the page width
      });

      // Another tab changed the notebook: show the new version.
      window.addEventListener('storage', (e) => {
        const typing = document.activeElement && document.activeElement.classList.contains('line-input');
        if (e.key !== STORAGE_KEY || Sheet.isOpen() || typing) return;
        reload();
        render();
      });
    }

    navigation.open = open;
    navigation.refresh = render;

    return { start };
  })();

  App.start();

  FN.app = { App };
})(globalThis.FN = globalThis.FN || {});
</script>
</body>
</html>
