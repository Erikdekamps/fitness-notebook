<script data-module="planScreen">
/**
 * One plan: its machines in the order you do them, with their drawings. Names only, no kg or reps.
 * Tap a machine to open its page; hold it, then drag it, to move it; drag it left to take it out.
 * Tap the name at the top to change it. A plan is removed in settings: drag it left.
 */
(function (FN) {
  'use strict';
  const { escapeHtml, clamp } = FN.util;
  const { byId, shake, thumbHtml } = FN.dom;
  const { Decide } = FN.decide;
  const { LineInput } = FN.lineInput;
  const { SwipeRows } = FN.swipeRows;
  const { HoldSort } = FN.holdSort;

  class PlanScreen {
    /** app: to draw the screen again after an undo. */
    constructor({ notebook, sheet, toast, app }) {
      this.notebook = notebook;
      this.sheet = sheet;
      this.toast = toast;
      this.app = app;
      this.root = byId('plan');
      this.title = byId('planTitle');
      this.list = byId('planMachines');
      this.addRow = byId('planAddRow');
      this.planId = null;
      this.listen();
    }

    render({ planId }) {
      this.planId = planId;
      this.renderTitle();
      this.renderList();
      this.renderAddRow();
    }

    /** The plan's name, as a button: tap it to change the name. */
    renderTitle() {
      const plan = this.notebook.plan(this.planId);
      const name = escapeHtml(plan ? plan.name : 'Plan');
      this.title.innerHTML = `<button class="title-btn" type="button" aria-label="${name}: tap to change the name">${name}</button>`;
    }

    renderList() {
      this.list.innerHTML = this.notebook.planMachines(this.planId).map(machineRowHtml).join('');
    }

    renderAddRow() {
      this.addRow.className = 'bleed add-row add-row--pencil';
      this.addRow.innerHTML = '<button class="pencil-btn" type="button">tap here to add a machine</button>';
    }

    /* ---- Machines ---- */

    /**
     * The panel to add a machine: a wheel with the machines not in the plan yet, and the drawing of the one on it.
     * After each machine it opens again for the next one, until you tap outside it.
     */
    addMachine(startIndex = 0) {
      const plan = this.notebook.plan(this.planId);
      if (!plan) return;
      const options = this.notebook.machinesNotInPlan(plan.id);
      if (!options.length) {
        this.toast.show('Every machine is in this plan');
        return;
      }
      const showPicked = () => {
        const picked = options[wheel.index];
        this.addRow.className = 'bleed add-row';
        this.addRow.innerHTML = `<div class="row-content is-pencil">${escapeHtml(picked.name)}</div>`;
        this.sheet.showPicture(picked.picture || null);
      };
      const [wheel] = this.sheet.open({
        title: `Add a machine to ${plan.name}`,
        picture: true,
        columns: 'minmax(0, 1fr)',
        labels: [{ text: 'Machine', left: true }],
        wheels: [{ label: 'Machine', align: 'left', items: options.map((m) => m.name), index: clamp(startIndex, 0, options.length - 1) }],
        actionLabel: `Add to ${plan.name}`,
        onChange: showPicked,
        onCancel: () => this.renderAddRow(),
        onAction: () => this.addPicked(plan, options[wheel.index], wheel.index),
      });
      showPicked();
    }

    /** Adds the machine that was on the wheel; then the panel comes back for the next one, while machines are left. */
    addPicked(plan, machine, index) {
      this.notebook.addPlanMachine(plan.id, machine.id);
      this.renderList();
      this.renderAddRow();
      if (this.notebook.machinesNotInPlan(plan.id).length) this.addMachine(index);
    }

    removeMachine(machineId) {
      const undo = this.notebook.removePlanMachine(this.planId, machineId);
      if (!undo) return;
      this.renderList();
      this.toast.show('Taken out of the plan', () => {
        undo();
        this.app.refresh();
      });
    }

    /* ---- The name ---- */

    /** Turns the name into a text field. Enter, or a tap somewhere else, saves it; Escape keeps the old name. */
    rename() {
      const plan = this.notebook.plan(this.planId);
      if (!plan) return;
      const field = new LineInput({
        value: plan.name,
        label: 'Name of the plan',
        onSubmit: (name, el) => {
          const what = Decide.rename(name, plan.name, this.notebook.planNameTaken(name, plan.id));
          if (what === 'refuse') {
            shake(el);
            return 'keep';
          }
          if (what === 'rename') this.notebook.renamePlan(plan.id, name);
          return 'close';
        },
        onClose: () => this.renderTitle(),
      });
      this.title.replaceChildren(field.el);
      field.focus();
    }

    listen() {
      this.addRow.addEventListener('click', (e) => {
        if (e.target.closest('.pencil-btn')) this.addMachine();
      });
      this.title.addEventListener('click', (e) => {
        if (e.target.closest('.title-btn')) this.rename();
      });

      const machineRows = new SwipeRows(this.list, {
        onTap: (row) => this.app.open({ view: 'machineStats', machineId: row.dataset.key }),
        onDelete: (row) => this.removeMachine(row.dataset.key),
      });
      new HoldSort(this.list, {
        swipeRows: machineRows,
        group: () => Array.from(this.list.children),
        onMove: (machineId, to) => this.notebook.movePlanMachine(this.planId, machineId, to),
        render: () => this.renderList(),
        isBusy: () => this.sheet.isOpen(),
      });
    }
  }

  function machineRowHtml(machine) {
    const name = escapeHtml(machine.name);
    return (
      `<div class="row row--machine" role="listitem" tabindex="0" data-key="${escapeHtml(machine.id)}">` +
      `<div class="row-content"><span class="name">${name}</span>${thumbHtml(machine.picture)}</div>` +
      `<button class="row-delete" type="button" tabindex="-1" aria-label="Take ${name} out of the plan"><span>Delete</span></button>` +
      '</div>'
    );
  }

  FN.planScreen = { PlanScreen };
})(globalThis.FN = globalThis.FN || {});
</script>

<script data-module="monthScreen">
/** The statistics screen: one month at a time, with arrows to the months before and after. */
(function (FN) {
  'use strict';
  const { DAY_NAMES, MONTH_NAMES, BLANK_ROW } = FN.config;
  const { escapeHtml, inRows } = FN.util;
  const { byId } = FN.dom;
  const { Calendar } = FN.calendar;
  const { Progress } = FN.progress;
  const { ChartMath } = FN.chartMath;

  const MAX_TALLY = 30; // above this only the number is shown

  const icon = (width, path) =>
    `<svg width="${width}" height="22" viewBox="0 0 ${width} 22" fill="none" stroke="currentColor" stroke-width="2.4" ` +
    `stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="${path}"/></svg>`;
  const CHEVRON = icon(12, 'M2 3l8 8-8 8');
  const ARROW_LEFT = icon(24, 'M20 11H4M10 5l-6 6 6 6');
  const ARROW_RIGHT = icon(24, 'M4 11h16M14 5l6 6-6 6');

  class MonthScreen {
    /** app: to open a machine's chart. */
    constructor({ notebook, app }) {
      this.notebook = notebook;
      this.app = app;
      this.root = byId('stats');
      this.body = byId('statsBody');
      this.month = null; // "YYYY-MM" on screen; null means this month
      this.body.addEventListener('click', (e) => this.onClick(e));
    }

    /** Start on this month the next time the screen is drawn. */
    goToThisMonth() {
      this.month = null;
    }

    render() {
      const today = Calendar.today();
      const dates = Progress.sessionDates(this.notebook.lines);
      const range = Calendar.monthRange(dates, today);
      this.month = Calendar.clampMonth(this.month || range.last, range);
      const { y, m } = Calendar.monthParts(this.month);
      const cells = Calendar.monthCells(dates, y, m, today);
      const isThisMonth = this.month === range.last;

      this.body.innerHTML =
        monthNavHtml(this.month, range) +
        weekDaysHtml() +
        inRows(cells, 7).map((week) => `<div class="week">${week.map(cellHtml).join('')}</div>`).join('') +
        BLANK_ROW +
        statLineHtml('sessions', Calendar.countTrained(cells)) +
        (isThisMonth ? statLineHtml('weeks in a row', Calendar.weeksInARow(dates, today)) : '') + // a streak is about now
        BLANK_ROW +
        machineLinksHtml(Progress.loggedMachines(this.notebook.machinesAZ(), this.notebook.lines));
    }

    onClick(e) {
      const arrow = e.target.closest('[data-month]');
      if (arrow) {
        this.month = Calendar.shiftMonth(this.month, arrow.dataset.month === 'prev' ? -1 : 1);
        this.render();
        return;
      }
      const machine = e.target.closest('[data-machine]');
      if (machine) this.app.open({ view: 'machineStats', machineId: machine.dataset.machine });
    }
  }

  /* ---- Markup ---- */

  function monthNavHtml(month, range) {
    const { y, m } = Calendar.monthParts(month);
    const name = MONTH_NAMES[m - 1] + (y === new Date().getFullYear() ? '' : ` ${y}`);
    return (
      '<div class="month-nav">' +
      monthArrowHtml('prev', month > range.first) +
      `<span class="month-name" aria-live="polite">${name}</span>` +
      monthArrowHtml('next', month < range.last) +
      '</div>'
    );
  }

  /** An arrow to another month, or an empty spot of the same size when there is no month to go to. */
  function monthArrowHtml(direction, show) {
    if (!show) return '<span class="month-arrow" aria-hidden="true"></span>';
    const label = direction === 'prev' ? 'Month before' : 'Month after';
    return `<button class="month-arrow" type="button" data-month="${direction}" aria-label="${label}">${direction === 'prev' ? ARROW_LEFT : ARROW_RIGHT}</button>`;
  }

  function weekDaysHtml() {
    const mondayFirst = DAY_NAMES.slice(1).concat(DAY_NAMES[0]);
    return `<div class="week is-pencil is-small" aria-hidden="true">${mondayFirst.map((day) => `<span>${day}</span>`).join('')}</div>`;
  }

  function cellHtml(cell) {
    if (cell.state === 'trained') return `<span class="is-bold" role="img" aria-label="${cell.day}: trained">×</span>`;
    if (cell.state === 'rest') return '<span class="is-pencil" aria-hidden="true">·</span>';
    return '<span></span>';
  }

  function tallyHtml(count) {
    if (count < 1 || count > MAX_TALLY) return '';
    const { path, width } = ChartMath.tallyMarks(count);
    return (
      `<svg width="${width}" height="26" viewBox="0 0 ${width} 26" fill="none" stroke="currentColor" stroke-width="2.2" ` +
      `stroke-linecap="round" aria-hidden="true" focusable="false"><path d="${path}"/></svg>`
    );
  }

  function statLineHtml(label, count) {
    return `<div class="stat-line"><span>${label}</span>${tallyHtml(count)}<span class="mark">${count}</span></div>`;
  }

  /** A link to the chart of each machine that has been logged. */
  function machineLinksHtml(machines) {
    if (!machines.length) return '<div class="stat-line is-pencil">no machine logged yet</div>';
    return machines
      .map((m) => `<button class="stat-link" type="button" data-machine="${escapeHtml(m.id)}"><span>${escapeHtml(m.name)}</span>${CHEVRON}</button>`)
      .join('');
  }

  FN.monthScreen = { MonthScreen };
})(globalThis.FN = globalThis.FN || {});
</script>

<script data-module="machineScreen">
/**
 * The page of one machine: its drawing, big (tap it, or 1 2 3, for each step of the move), what it works,
 * and your weights: on the ruled lines over time, and when the weight changed.
 */
(function (FN) {
  'use strict';
  const { MONTH_SHORT, BLANK_ROW } = FN.config;
  const { formatKg, escapeHtml } = FN.util;
  const { byId } = FN.dom;
  const { Calendar } = FN.calendar;
  const { Progress } = FN.progress;
  const { ChartMath } = FN.chartMath;
  const { Pictures } = FN.pictures;
  const { Decide } = FN.decide;

  const MAX_CHART_ROWS = 5;   // ruled lines a chart may use as its grid
  const LINE_PX = 44;         // keep in sync with --line
  const RULE_Y = 36.5;        // where the ruled line sits inside a row
  const CHART_LEFT = 66;      // room for the kg written on the left
  const CHART_RIGHT_GAP = 28;
  const MAX_DOTS = 24;        // with more points, only the changes get a dot
  const MAX_DATE_LABELS = 5;  // with more changes, the chart shows months instead of dates

  class MachineScreen {
    constructor({ notebook }) {
      this.notebook = notebook;
      this.root = byId('machineStats');
      this.title = byId('machineStatsTitle');
      this.body = byId('machineStatsBody');
      this.picture = null; // the drawing on the page, and the step of the move it shows
      this.step = 1;
      this.body.addEventListener('click', (e) => this.onClick(e));
    }

    render({ machineId }) {
      const machine = this.notebook.machine(machineId);
      const name = machine ? machine.name : 'Machine';
      this.title.textContent = name;
      this.picture = machine ? machine.picture : null;
      this.step = 1;
      const points = Progress.machineHistory(this.notebook.lines, machineId);
      this.body.innerHTML = drawingHtml(name, this.picture) + aboutHtml(this.picture) + weightsHtml(name, points, this.body.clientWidth || 326);
    }

    /** A tap on a step's number shows that step; a tap on the drawing shows the next one. */
    onClick(e) {
      const step = e.target.closest('[data-step]');
      if (step) this.showStep(Number(step.dataset.step));
      else if (e.target.closest('.big-drawing')) this.showStep(Decide.nextStep(this.step, Pictures.FRAMES.length));
    }

    showStep(step) {
      this.step = step;
      this.body.querySelector('.big-drawing img').setAttribute('src', Pictures.src(this.picture, step));
      for (const button of this.body.querySelectorAll('[data-step]')) button.setAttribute('aria-pressed', String(Number(button.dataset.step) === step));
    }
  }

  /* ---- Markup ---- */

  /** The drawing, big, on its first step, with the numbers of the steps under it. Nothing without a drawing. */
  function drawingHtml(name, picture) {
    if (!picture) return '';
    const steps = Pictures.FRAMES.map((n) => `<button type="button" data-step="${n}" aria-pressed="${n === 1}">${n}</button>`).join('');
    return (
      `<button class="big-drawing" type="button" aria-label="${escapeHtml(name)}: the next step of the move"><img src="${Pictures.src(picture)}" alt=""></button>` +
      `<div class="steps" role="group" aria-label="Steps of the move">${steps}</div>`
    );
  }

  /** What the machine works, and with what, as its drawing says. Nothing without a drawing. */
  function aboutHtml(picture) {
    const about = Pictures.aboutOf(picture);
    if (!about) return '';
    const line = (label, value) => `<div class="info"><span class="label">${label}</span><span>${escapeHtml(value)}</span></div>`;
    return (
      BLANK_ROW +
      '<h2 class="section-title">what it works</h2>' +
      line('mostly', about.mostly) +
      (about.also ? line('also', about.also) : '') +
      line('with', about.with) +
      BLANK_ROW
    );
  }

  /** Your weights on this machine: the chart and when the weight changed, or that nothing was logged yet. */
  function weightsHtml(name, points, width) {
    const weights = points.length ? chartHtml(name, points, width) + changesHtml(points) : '<div class="stat-line is-pencil">nothing logged yet</div>';
    return '<h2 class="section-title">your weights</h2>' + weights;
  }

  function chartHtml(name, points, width) {
    const weights = points.map((p) => p.weight);
    const scale = ChartMath.scale(weights, MAX_CHART_ROWS);
    const rows = ChartMath.rowsNeeded(weights, scale, MAX_CHART_ROWS);
    const height = rows * LINE_PX;
    const xy = ChartMath.pointPositions(points, scale, { left: CHART_LEFT, right: width - CHART_RIGHT_GAP, firstLineY: RULE_Y, lineHeight: LINE_PX });
    const dots = points.length <= MAX_DOTS ? xy : Progress.changeIndexes(points).map((i) => xy[i]);
    const first = points[0];
    const last = points[points.length - 1];
    const label =
      `${escapeHtml(name)}: ${points.length} times, from ${formatKg(first.weight)} kg on ${Calendar.written(first.date).date} ` +
      `to ${formatKg(last.weight)} kg on ${Calendar.written(last.date).date}`;

    return (
      `<div class="chart" style="height: ${height}px">` +
      ChartMath.axisValues(scale, rows).map(({ row, value }, i) => `<span class="axis" style="top: ${row * LINE_PX}px">${formatKg(value)}${i === 0 ? ' kg' : ''}</span>`).join('') +
      `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" fill="none" role="img" aria-label="${label}">` +
      `<path d="M${xy.map((p) => `${p.x} ${p.y}`).join('L')}" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>` +
      `<g fill="currentColor">${dots.map((p) => `<circle cx="${p.x}" cy="${p.y}" r="4"/>`).join('')}</g>` +
      '</svg></div>' +
      `<div class="x-labels" aria-hidden="true">${xLabels(points, xy).map((l) => `<span style="left: ${l.x}px">${l.text}</span>`).join('')}</div>`
    );
  }

  /** What is written under the chart: a date under each change when they fit, else month names. */
  function xLabels(points, xy) {
    const changes = Progress.changeIndexes(points);
    if (changes.length <= MAX_DATE_LABELS && ChartMath.spacedOut(changes.map((i) => xy[i].x), 50)) {
      return changes.map((i) => ({ x: xy[i].x, text: Calendar.written(points[i].date).date }));
    }
    const thisYear = new Date().getFullYear();
    return ChartMath.monthLabels(points, xy, 48).map((label, i) => ({
      x: label.x,
      text: MONTH_SHORT[label.month - 1] + (i === 0 && label.year !== thisYear ? ` '${String(label.year).slice(-2)}` : ''),
    }));
  }

  /** The list under the chart: every time the weight was new, newest first. */
  function changesHtml(points) {
    const rows = Progress.weightChanges(points).reverse().map((change) => {
      const { date, day } = Calendar.written(change.date);
      return `<div class="stat-line"><span>${date}</span><span>${day}</span><span class="mark">${formatKg(change.weight)} kg</span></div>`;
    });
    return BLANK_ROW + '<div class="stat-line is-pencil">when the weight changed</div>' + rows.join('');
  }

  FN.machineScreen = { MachineScreen };
})(globalThis.FN = globalThis.FN || {});
</script>

<script data-module="app">
/** Start-up and moving between the screens: notebook, settings, one plan, the machines, statistics, one machine. */
(function (FN) {
  'use strict';
  const { STORAGE_KEY, PREFS_KEY, TIMER_KEY } = FN.config;
  const { byId, onNextFrame, scrollToBottom } = FN.dom;
  const { Store } = FN.store;
  const { Prefs } = FN.prefs;
  const { Notebook } = FN.notebook;
  const { Toast } = FN.toast;
  const { Sheet } = FN.sheet;
  const { TimerButton } = FN.timerButton;
  const { NotebookScreen } = FN.notebookScreen;
  const { SettingsScreen } = FN.settingsScreen;
  const { PlanScreen } = FN.planScreen;
  const { MonthScreen } = FN.monthScreen;
  const { MachinesScreen } = FN.machinesScreen;
  const { MachineScreen } = FN.machineScreen;
  const { Decide } = FN.decide;

  /** Whether a text field on the paper has the focus. */
  const isTyping = () => !!document.activeElement && document.activeElement.classList.contains('line-input');

  class App {
    constructor() {
      this.toast = new Toast();
      this.sheet = new Sheet({ toast: this.toast });
      this.notebook = new Notebook(Notebook.start(Store.load()), { onSave: (data) => Store.save(data) });
      this.prefs = Prefs.load();
      this.timer = new TimerButton({ prefs: () => this.prefs });

      const parts = { notebook: this.notebook, sheet: this.sheet, toast: this.toast, timer: this.timer, app: this };
      this.screens = {
        notebook: new NotebookScreen(parts),
        settings: new SettingsScreen(parts),
        plan: new PlanScreen(parts),
        machines: new MachinesScreen(parts),
        stats: new MonthScreen(parts),
        machineStats: new MachineScreen(parts),
      };
      this.topButtons = [byId('cogBtn'), byId('statsBtn')];
      this.current = { view: 'notebook' };
      this.notebookScrollY = 0;
    }

    /**
     * Shows a screen. `next` is { view }, or { view: 'machineStats', machineId } for a machine chart,
     * or { view: 'plan', planId } for a plan. A plan that is gone shows the settings instead.
     */
    show(next) {
      const target = this.targetFor(next);
      this.sheet.cancel();
      if (this.current.view === 'notebook' && target.view !== 'notebook') {
        this.notebookScrollY = window.scrollY;
        this.screens.stats.goToThisMonth();
      }
      this.current = target;
      for (const [name, screen] of Object.entries(this.screens)) screen.root.hidden = name !== target.view;
      this.topButtons.forEach((button) => { button.hidden = target.view !== 'notebook'; });
      this.timer.setShown(target.view === 'notebook');
      this.refresh();
      window.scrollTo(0, target.view === 'notebook' ? this.notebookScrollY : 0);
      this.screens.notebook.updateTodayButton();
    }

    /** The screen to show for `next`: the notebook when there is no such screen, settings when the plan is gone. */
    targetFor(next) {
      return Decide.screenFor(next, Object.keys(this.screens), (planId) => !!this.notebook.plan(planId));
    }

    /** Changes some settings and saves them. `changes` is part of { timerOn, restSeconds, kgStep }. */
    setPrefs(changes) {
      this.prefs = Prefs.clean({ ...this.prefs, ...changes });
      Prefs.save(this.prefs);
      if (!this.prefs.timerOn) this.timer.stop();
    }

    /** Draws the screen that is showing again. */
    refresh() {
      this.screens[this.current.view].render(this.current);
    }

    /** Shows a screen and remembers it, so the phone's back gesture returns here. */
    open(next) {
      try {
        history.pushState(next, '');
      } catch (_) {
        /* history not available (sandboxed frame): the back arrows still work */
      }
      this.show(next);
    }

    back(fallbackView) {
      if (Decide.canGoBack(history.state, this.current.view)) history.back(); // popstate shows the screen underneath
      else this.show({ view: fallbackView });
    }

    start() {
      try {
        history.scrollRestoration = 'manual';
        history.replaceState({ view: 'notebook' }, '');
      } catch (_) {
        /* not available: fine */
      }
      this.notebook.save();
      this.screens.notebook.render();
      scrollToBottom(false);
      if (document.fonts && document.fonts.ready) {
        const y = window.scrollY;
        document.fonts.ready.then(() => {
          if (this.current.view === 'notebook' && window.scrollY === y) scrollToBottom(false);
        });
      }
      this.listen();
    }

    listen() {
      byId('cogBtn').addEventListener('click', () => this.open({ view: 'settings' }));
      byId('statsBtn').addEventListener('click', () => this.open({ view: 'stats' }));
      /** @type {NodeListOf<HTMLElement>} */ (document.querySelectorAll('[data-back]')).forEach((button) => {
        button.addEventListener('click', () => this.back(button.dataset.back));
      });
      window.addEventListener('popstate', (e) => this.show(e.state));

      const refreshTodayButton = onNextFrame(() => this.screens.notebook.updateTodayButton());
      window.addEventListener('scroll', refreshTodayButton, { passive: true });
      window.addEventListener('resize', () => {
        refreshTodayButton();
        if (this.current.view === 'machineStats') this.refresh(); // the chart follows the page width
      });

      window.addEventListener('storage', (e) => this.onStorage(e));
    }

    /** Another tab changed something that is saved: the timer, the settings or the notebook. Show the new version. */
    onStorage(e) {
      if (e.key === TIMER_KEY) this.timer.reload();
      else if (e.key === PREFS_KEY) this.reloadPrefs();
      else if (e.key === STORAGE_KEY) this.reloadNotebook();
    }

    reloadPrefs() {
      this.prefs = Prefs.load();
      if (this.current.view === 'settings' && !this.sheet.isOpen()) this.refresh();
    }

    /** Not while a panel is open or a name is being typed: that would pull the page from under it. */
    reloadNotebook() {
      if (this.sheet.isOpen() || isTyping()) return;
      this.notebook.reload(Notebook.start(Store.load()));
      this.refresh();
    }
  }

  const app = new App();
  app.start();

  FN.app = { App, app };
})(globalThis.FN = globalThis.FN || {});
</script>
</body>
</html>
