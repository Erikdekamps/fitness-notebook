      this.config = null;
      this.el.classList.remove('is-open');
      this.backdrop.hidden = true;
      this.behind.forEach((el) => { el.inert = false; });
      if (this.el.contains(document.activeElement)) document.activeElement.blur();
      return cfg;
    }

    cancel() {
      const cfg = this.close();
      if (cfg && cfg.onCancel) cfg.onCancel();
    }

    /** While typing, the wheels fold away so the field and the button fit above the keyboard. */
    updateTyping() {
      const field = this.textField;
      const typing =
        !!this.config &&
        (this.config.wheels.length === 0 || (!field.hidden && (field.value !== '' || document.activeElement === field)));
      this.el.classList.toggle('is-typing', typing);
    }

    listen() {
      this.action.addEventListener('click', () => {
        const cfg = this.close();
        if (cfg) cfg.onAction();
      });
      this.backdrop.addEventListener('click', () => this.cancel());
      this.cancelButton.addEventListener('click', () => this.cancel());

      const field = this.textField;
      field.addEventListener('input', () => {
        this.updateTyping();
        if (this.config && this.config.onChange) this.config.onChange(-1);
      });
      field.addEventListener('focus', () => this.updateTyping());
      // Wait a moment before unfolding the wheels, so a tap on the button still lands on it.
      field.addEventListener('blur', () => setTimeout(() => this.updateTyping(), 250));
      field.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
        e.preventDefault();
        this.action.click();
      });

      document.addEventListener('keydown', (e) => {
        if (!this.config) return;
        if (e.key === 'Escape') {
          e.preventDefault();
          this.cancel();
        } else if (e.key === 'Enter' && e.target.classList.contains('wheel')) {
          e.preventDefault();
          this.action.click();
        }
      });

      // Keep the paper underneath still while the sheet is up.
      this.el.addEventListener('touchmove', (e) => { if (!e.target.closest('.wheel')) e.preventDefault(); }, { passive: false });
      this.backdrop.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
      this.backdrop.addEventListener('wheel', (e) => e.preventDefault(), { passive: false });

      // Ride on top of the on-screen keyboard.
      if (window.visualViewport) {
        const viewport = window.visualViewport;
        const lift = () => {
          this.el.style.bottom = `${Math.max(0, window.innerHeight - viewport.height - viewport.offsetTop)}px`;
        };
        viewport.addEventListener('resize', lift);
        viewport.addEventListener('scroll', lift);
      }
    }
  }

  FN.sheet = { Sheet };
})(globalThis.FN = globalThis.FN || {});
</script>

<script data-module="swipeRows">
/**
 * Tap a row to change it, drag it left to delete it. A row looks like:
 *   <div class="row" data-key="…"><div class="row-content">…</div><button class="row-delete">…</button></div>
 * A tap (or Enter) calls onTap(row, target), where target is what was tapped inside the row.
 * Dragging left reveals Delete; dragging far deletes at once. The Delete key deletes a focused row.
 * onDelete(row) runs after the row has animated away.
 */
(function (FN) {
  'use strict';
  const { RULE_INSET_PX, OPEN_OFFSET_PX, FULL_SWIPE } = FN.config;
  const { clamp } = FN.util;

  class SwipeRows {
    constructor(container, { onTap, onDelete }) {
      this.container = container;
      this.onTap = onTap;
      this.onDelete = onDelete;
      this.gesture = null;
      this.openRow = null;
      this.swallowClick = false;
      this.listen();
    }

    /** Moves a row's writing to `x` (0 or less) and shows that much of the Delete button. */
    slide(row, x, animate) {
      const content = row.querySelector('.row-content');
      const button = row.querySelector('.row-delete');
      content.classList.toggle('is-animating', animate);
      button.classList.toggle('is-animating', animate);
      content.style.transform = x ? `translateX(${x}px)` : '';
      button.style.width = `${Math.max(0, -x - RULE_INSET_PX)}px`;
      if (!x) row.classList.remove('is-armed');
    }

    closeOpenRow() {
      if (!this.openRow) return;
      this.slide(this.openRow, 0, true);
      this.openRow = null;
    }

    /** Slides a row away, folds it shut, then hands it to onDelete. */
    removeRow(row) {
      if (row.classList.contains('is-removing')) return;
      row.classList.add('is-removing');
      if (row === this.openRow) this.openRow = null;
      this.slide(row, -row.offsetWidth, true);
      setTimeout(() => {
        row.style.height = `${row.offsetHeight}px`;
        void row.offsetHeight;
        row.classList.add('is-collapsing');
        row.style.height = '0px';
        setTimeout(() => this.onDelete(row), 180);
      }, 200);
    }

    listen() {
      const container = this.container;

      // Touching anywhere else closes an open row; that touch does nothing else.
      document.addEventListener('pointerdown', (e) => {
        this.swallowClick = false;
        if (this.openRow && !this.openRow.contains(e.target)) {
          this.closeOpenRow();
          this.swallowClick = container.contains(e.target);
        }
      }, true);

      container.addEventListener('pointerdown', (e) => this.startGesture(e));
      container.addEventListener('pointermove', (e) => this.moveGesture(e));
      container.addEventListener('pointerup', (e) => this.endGesture(e));
      container.addEventListener('pointercancel', (e) => this.endGesture(e));
      container.addEventListener('click', (e) => this.onClick(e));
      container.addEventListener('keydown', (e) => this.onKey(e));
    }

    startGesture(e) {
      this.gesture = null;
      if (this.swallowClick || (e.pointerType === 'mouse' && e.button !== 0)) return;
      const row = e.target.closest('.row');
      if (!row || row.classList.contains('is-removing') || e.target.closest('input, .row-delete')) return;
      this.gesture = {
        row,
        pointerId: e.pointerId,
        startX: e.clientX,
        startY: e.clientY,
        from: row === this.openRow ? -OPEN_OFFSET_PX : 0,
        x: 0,
        axis: null,
      };
    }

    moveGesture(e) {
      const g = this.gesture;
      if (!g || e.pointerId !== g.pointerId) return;
      const dx = e.clientX - g.startX;
      const dy = e.clientY - g.startY;
      if (!g.axis) {
        if (Math.hypot(dx, dy) < 8) return;
        g.axis = Math.abs(dx) > Math.abs(dy) * 1.2 ? 'x' : 'y';
        if (g.axis === 'y') {
          this.gesture = null; // a scroll: leave it to the browser
          return;
        }
        try { g.row.setPointerCapture(g.pointerId); } catch (_) { /* pointer already released */ }
      }
      const width = g.row.offsetWidth;
      g.x = clamp(g.from + dx, -width, 0);
      this.slide(g.row, g.x, false);
      g.row.classList.toggle('is-armed', -g.x > width * FULL_SWIPE);
    }

    endGesture(e) {
      const g = this.gesture;
      if (!g || e.pointerId !== g.pointerId) return;
      this.gesture = null;
      if (g.axis !== 'x') return;
      this.swallowClick = true;
      if (e.type === 'pointercancel') {
        this.slide(g.row, g.from, true);
        return;
      }
      const width = g.row.offsetWidth;
      if (-g.x > width * FULL_SWIPE) {
        this.removeRow(g.row);
      } else if (-g.x > OPEN_OFFSET_PX / 2) {
        if (this.openRow !== g.row) this.closeOpenRow();
        this.slide(g.row, -OPEN_OFFSET_PX, true);
        this.openRow = g.row;
      } else {
        this.slide(g.row, 0, true);
        if (this.openRow === g.row) this.openRow = null;
      }
    }

    onClick(e) {
      if (this.swallowClick) {
        this.swallowClick = false;
        return;
      }
      const deleteButton = e.target.closest('.row-delete');
      if (deleteButton) {
        this.removeRow(deleteButton.closest('.row'));
        return;
      }
      if (e.target.closest('input')) return;
      const row = e.target.closest('.row');
      if (!row || row.classList.contains('is-removing')) return;
      if (row === this.openRow) this.closeOpenRow();
      else this.onTap(row, e.target);
    }

    onKey(e) {
      const row = e.target;
      if (!row.classList || !row.classList.contains('row')) return;
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        this.onTap(row, row);
      } else if (e.key === 'Delete' || e.key === 'Backspace') {
        e.preventDefault();
        this.removeRow(row);
      }
    }
  }

  FN.swipeRows = { SwipeRows };
})(globalThis.FN = globalThis.FN || {});
</script>

<!-- ==== 3. Panels: adding and changing lines ================================================== -->

<script data-module="lineEditor">
/**
 * The add-or-change-a-line panel: machine wheels, or your own text.
 * While you pick, the line shows on the paper in pencil; Log or Save writes it in pen.
 */
(function (FN) {
  'use strict';
  const { SETS, REPS, FIRST_TIME_VALUES, PREVIEW_ID } = FN.config;
  const { round2, formatKg, indexOr } = FN.util;
  const { Progress } = FN.progress;
  const { LineMarkup } = FN.lineMarkup;

  const SETS_FALLBACK = SETS.indexOf(FIRST_TIME_VALUES.sets);
  const REPS_FALLBACK = REPS.indexOf(FIRST_TIME_VALUES.reps);

  class LineEditor {
    /** page: the notebook screen. It draws the pencil preview and hears when the panel closes. */
    constructor({ notebook, sheet, page }) {
      this.notebook = notebook;
      this.sheet = sheet;
      this.page = page;
      this.wheels = null;
    }

    /** Opens the panel for a new line (editing = null), or to change a text or machine line. */
    open(editing) {
      this.editing = editing;
      this.editingMachine = editing && editing.type === 'machine' ? editing : null;
      this.machines = this.pickableMachines();
      this.latest = Progress.analyzeLines(this.notebook.lines).latest;
      this.wheels = null;

      const hasWheels = this.machines.length > 0;
      const machineIndex = this.startMachineIndex();
      const start = this.editingMachine || (hasWheels ? this.lastTime(this.machines[machineIndex]) : FIRST_TIME_VALUES);
      this.settledIndex = machineIndex;
      this.kgList = Progress.kgOptions(start.weight);

      this.wheels = this.sheet.open({
        title: editing ? 'Change this line' : 'Add a line',
        text: {
          value: editing && editing.type === 'text' ? editing.text : '',
          placeholder: hasWheels ? 'or write your own line' : 'write a line',
        },
        columns: 'minmax(0, 1fr) 56px 40px 40px',
        labels: [{ text: 'Machine', left: true }, { text: 'kg' }, { text: 'sets' }, { text: 'reps' }],
        wheels: hasWheels
          ? [
              { label: 'Machine', align: 'left', items: this.machines.map((m) => m.name), index: machineIndex },
              { label: 'Weight in kg', items: this.kgList.map(formatKg), index: indexOr(this.kgList, round2(start.weight)) },
              { label: 'Sets', items: SETS.map(String), index: indexOr(SETS, start.sets, SETS_FALLBACK) },
              { label: 'Reps', items: REPS.map(String), index: indexOr(REPS, start.reps, REPS_FALLBACK) },
            ]
          : [],
        actionLabel: editing ? 'Save' : 'Log',
        onChange: () => this.preview(),
        onSettle: (i) => { if (i === 0) this.followMachine(); },
        onAction: () => this.commit(),
        onCancel: () => this.page.done(),
      });
      this.preview();
      this.page.makeRoom(editing, 'line');
    }

    /** The machines on the wheel, A to Z. A machine removed in settings stays pickable for its own old line. */
    pickableMachines() {
      const machines = this.notebook.machinesAZ();
      const old = this.editingMachine;
      if (old && !machines.some((m) => m.id === old.machineId)) machines.unshift({ id: old.machineId, name: old.name });
      return machines;
    }

    /** Where the machine wheel starts: the line's own machine, or the first one not done today. */
    startMachineIndex() {
      if (this.editingMachine) return this.machines.findIndex((m) => m.id === this.editingMachine.machineId);
      if (!this.machines.length) return 0;
      const done = Progress.machinesInCurrentDay(this.notebook.lines);
      return Math.max(0, this.machines.findIndex((m) => !done.has(m.id)));
    }

    /** What you did last time on a machine, or the first-time values. */
    lastTime(machine) {
      return this.latest.get(machine.id) || FIRST_TIME_VALUES;
    }

    wheelValues() {
      const [, kg, sets, reps] = this.wheels;
      return { weight: this.kgList[kg.index], sets: SETS[sets.index], reps: REPS[reps.index] };
    }

    /** What Log would write: a text line when something is typed, else a machine line. Null when there is nothing. */
    fields() {
      const text = this.sheet.text();
      if (text) return { type: 'text', text };
      if (!this.machines.length) return null;
      const index = this.wheels[0].index;
      const machine = this.machines[index];
      // While the machine wheel is still moving, show the numbers it will fill in.
      const moving = !this.editingMachine && index !== this.settledIndex;
      const { weight, sets, reps } = moving ? this.lastTime(machine) : this.wheelValues();
      const keepName = this.editingMachine && machine.id === this.editingMachine.machineId; // old lines keep their written name
      return { type: 'machine', machineId: machine.id, name: keepName ? this.editingMachine.name : machine.name, weight, sets, reps };
    }

    /** Shows the line in pencil, with the mark it would get. */
    preview() {
      if (!this.wheels) return;
      const next = this.fields();
      if (!next) {
        this.page.preview(this.editing, 'text', '');
        return;
      }
      const editing = this.editing;
      const line = { id: editing ? editing.id : PREVIEW_ID, ...next };
      const lines = editing ? this.notebook.lines.map((l) => (l.id === editing.id ? line : l)) : this.notebook.lines.concat(line);
      const mark = Progress.analyzeLines(lines).marks.get(line.id);
      this.page.preview(editing, line.type, LineMarkup.content(line, mark));
    }

    /** When the machine wheel stops on another machine, load that machine's numbers. */
    followMachine() {
      const index = this.wheels[0].index;
      if (index === this.settledIndex) return;
      this.settledIndex = index;
      const values = this.editingMachine ? this.wheelValues() : this.lastTime(this.machines[index]);
      const [, kg, sets, reps] = this.wheels;
      this.kgList = Progress.kgOptions(values.weight);
      kg.setItems(this.kgList.map(formatKg), indexOr(this.kgList, round2(values.weight)));
      sets.setIndex(indexOr(SETS, values.sets, SETS_FALLBACK), false);
      reps.setIndex(indexOr(REPS, values.reps, REPS_FALLBACK), false);
      this.preview();
    }

    commit() {
      const next = this.fields();
      if (next) {
        if (this.editing) this.notebook.replaceLine(this.editing.id, next);
        else this.notebook.addLine(next);
      }
      this.page.done({ scroll: !this.editing && !!next });
    }
  }

  FN.lineEditor = { LineEditor };
})(globalThis.FN = globalThis.FN || {});
</script>

<script data-module="dateEditor">
/** The date panel: day, month and year wheels for a new date or to change one. No dates after today. */
(function (FN) {
  'use strict';
  const { YEARS_BACK } = FN.config;
  const { range, indexOr } = FN.util;
  const { Calendar } = FN.calendar;
  const { LineMarkup } = FN.lineMarkup;

  const DAYS = range(1, 31);
  const MONTHS = range(1, 12);

  class DateEditor {
    /** page: the notebook screen. It draws the pencil preview and hears when the panel closes. */
    constructor({ notebook, sheet, page }) {
      this.notebook = notebook;
      this.sheet = sheet;
      this.page = page;
      this.wheels = null;
    }

    /** Opens the panel for a new date (editing = null), or to change a date line. */
    open(editing) {
      this.editing = editing;
      this.today = Calendar.today();
      this.wheels = null;
      const now = Calendar.parts(this.today);
      const start = Calendar.parts(editing ? editing.date : this.today);
      const writtenYears = this.notebook.lines.filter((l) => l.type === 'date').map((l) => Calendar.parts(l.date).y);
      this.years = range(Math.min(now.y - YEARS_BACK, start.y, ...writtenYears), Math.max(now.y, start.y));

      this.wheels = this.sheet.open({
        title: editing ? 'Change the date' : 'Start a new date',
        columns: '64px 64px 84px',
        center: true,
        labels: [{ text: 'day' }, { text: 'month' }, { text: 'year' }],
        wheels: [
          { label: 'Day', items: DAYS.map(String), index: start.d - 1 },
          { label: 'Month', items: MONTHS.map(String), index: start.m - 1 },
          { label: 'Year', items: this.years.map(String), index: indexOr(this.years, start.y, this.years.length - 1) },
        ],
        actionLabel: editing ? 'Save' : 'Log',
        onChange: () => this.preview(),
        onSettle: () => this.snapToValid(),
        onAction: () => this.commit(),
        onCancel: () => this.page.done(),
      });
      this.preview();
      this.page.makeRoom(editing, 'date');
    }

    /** The picked date, made valid: no 31 November, nothing after today. */
    picked() {
      const [day, month, year] = this.wheels;
      const y = this.years[year.index];
      const m = MONTHS[month.index];
      const d = Math.min(DAYS[day.index], Calendar.daysInMonth(y, m));
      const iso = Calendar.toIso(y, m, d);
      return iso > this.today ? this.today : iso;
    }

    /** Turns the wheels back to the valid date once they stop. */
    snapToValid() {
      const [day, month, year] = this.wheels;
      const { y, m, d } = Calendar.parts(this.picked());
      if (day.index !== d - 1) day.setIndex(d - 1, true);
      if (month.index !== m - 1) month.setIndex(m - 1, true);
      const yearIndex = this.years.indexOf(y);
      if (year.index !== yearIndex) year.setIndex(yearIndex, true);
    }

    preview() {
      if (!this.wheels) return;
      this.page.preview(this.editing, 'date', LineMarkup.content({ type: 'date', date: this.picked() }));
    }

    commit() {
      const date = this.picked();
      if (this.editing) this.notebook.replaceLine(this.editing.id, { type: 'date', date });
      else this.notebook.addLine({ type: 'date', date });
      this.page.done({ scroll: !this.editing });
    }
  }

  FN.dateEditor = { DateEditor };
})(globalThis.FN = globalThis.FN || {});
</script>

<!-- ==== 4. Screens, and the app that switches between them ==================================== -->

<script data-module="notebookScreen">
/**
 * The notebook screen: the written lines, and the empty paper below them.
 * The first empty line adds a line; anywhere below it starts a new date.
 */
(function (FN) {
  'use strict';
  const { byId, scrollToBottom } = FN.dom;
  const { Progress } = FN.progress;
  const { LineMarkup } = FN.lineMarkup;
  const { SwipeRows } = FN.swipeRows;
  const { LineEditor } = FN.lineEditor;
  const { DateEditor } = FN.dateEditor;

  class NotebookScreen {
    constructor({ notebook, sheet, toast }) {
      this.notebook = notebook;
      this.sheet = sheet;
      this.toast = toast;
      this.root = byId('notebook');
      this.linesEl = byId('lines');
      this.addArea = byId('addArea');
      this.rowNext = byId('rowNext');
      this.rowDate = byId('rowDate');
      this.filler = byId('notebookFiller');
      this.todayBtn = byId('todayBtn');
      this.busy = false; // a panel is open
      this.lineEditor = new LineEditor({ notebook, sheet, page: this });
      this.dateEditor = new DateEditor({ notebook, sheet, page: this });
      this.listen();
    }

    render() {
      const { marks } = Progress.analyzeLines(this.notebook.lines);
      this.linesEl.innerHTML = LineMarkup.page(this.notebook.lines, marks);
      this.showAddLines();
      this.filler.style.height = '';
      this.updateTodayButton();
    }

    /** The empty lines under the last entry. A fresh notebook starts with a date. */
    showAddLines() {
      const empty = this.notebook.lines.length === 0;
      this.rowNext.hidden = empty;
      setButton(this.rowNext, 'line', 'tap to add a line');
      setButton(this.rowDate, 'date', empty ? 'tap to start with a date' : '', 'Start a new date');
    }

    /* ---- The panels ---- */

    openLineEditor(line) {
      this.busy = true;
      this.lineEditor.open(line);
    }

    openDateEditor(line) {
      this.busy = true;
      this.dateEditor.open(line);
    }

    /** An editor calls this when its panel closes. */
    done({ scroll } = {}) {
      this.busy = false;
      this.render();
      if (scroll) scrollToBottom(true);
    }

    /**
     * Shows the line being picked, in pencil: in its own row when changing a line,
     * else on the empty lines (a date skips a line first).
     */
    preview(editing, type, html) {
      if (editing) {
        this.previewInRow(editing, type, html);
      } else if (type === 'date') {
        clearRow(this.rowNext); // this becomes the skipped line
        setRowContent(this.rowDate, html, 'is-pencil is-bold');
      } else {
        setRowContent(this.rowNext, html, type === 'text' ? 'is-pencil is-text' : 'is-pencil');
        clearRow(this.rowDate);
      }
    }

    previewInRow(line, type, html) {
      const row = this.rowFor(line);
      if (!row) return;
      row.className = `row row--${type}`;
      const content = row.querySelector('.row-content');
      content.classList.add('is-pencil');
      content.innerHTML = html;
    }

    /** Leaves room under the page and scrolls so the line being picked stays visible above the panel. */
    makeRoom(editing, kind) {
      const target = editing ? this.rowFor(editing) : kind === 'date' ? this.rowDate : this.rowNext;
      const sheetHeight = this.sheet.height();
      this.filler.style.height = `calc(var(--line) * 4 + ${sheetHeight}px)`;
      if (!target) return;
      const limit = window.innerHeight - sheetHeight - 16;
      const bottom = target.getBoundingClientRect().bottom;
      if (bottom > limit) window.scrollBy({ top: bottom - limit, behavior: 'smooth' });
    }

    rowFor(line) {
      return this.linesEl.querySelector(`.row[data-key="${CSS.escape(line.id)}"]`);
    }

    /* ---- Written lines ---- */

    tapLine(row) {
      const line = this.notebook.line(row.dataset.key);
      if (!line || this.busy) return;
      if (line.type === 'date') this.openDateEditor(line);
      else this.openLineEditor(line);
    }

    removeLine(id) {
      const line = this.notebook.line(id);
      const undo = this.notebook.removeLine(id);
      if (!undo) return;
      this.render();
      this.toast.show(line.type === 'date' ? 'Date removed' : 'Line removed', () => {
        undo();
        this.render();
      });
    }

    /* ---- Back to today ---- */

    updateTodayButton() {
      const away = !this.root.hidden && !this.sheet.isOpen() && this.addArea.getBoundingClientRect().top > window.innerHeight;
      this.todayBtn.classList.toggle('is-visible', away);
    }

    listen() {
      this.addArea.addEventListener('click', (e) => {
        const button = e.target.closest('[data-action]');
        if (!button || this.busy) return;
        if (button.dataset.action === 'line') this.openLineEditor(null);
        else this.openDateEditor(null);
      });

      // The empty paper below the add line also starts a new date.
      this.filler.addEventListener('click', () => {
        if (!this.busy) this.openDateEditor(null);
      });

      new SwipeRows(this.linesEl, {
        onTap: (row) => this.tapLine(row),
        onDelete: (row) => this.removeLine(row.dataset.key),
      });

      this.todayBtn.addEventListener('click', () => scrollToBottom(true));
    }
  }

  /* ---- The empty lines ---- */

  function setButton(row, action, text, label) {
    row.className = 'add-row';
    row.innerHTML =
      `<button class="add-btn is-pencil" type="button" data-action="${action}"` +
      `${label ? ` aria-label="${label}"` : ''}>${text}</button>`;
  }

  function setRowContent(row, html, className = '') {
    row.className = 'add-row';
    row.innerHTML = `<div class="row-content ${className}">${html}</div>`;
  }

  function clearRow(row) {
    row.className = 'add-row';
    row.innerHTML = '';
  }

  FN.notebookScreen = { NotebookScreen };
})(globalThis.FN = globalThis.FN || {});
</script>

<script data-module="settingsScreen">
/** The settings screen: the machines list, and the backup (export and import). */
(function (FN) {
  'use strict';
  const { escapeHtml } = FN.util;
  const { byId, shake, downloadFile } = FN.dom;
  const { Calendar } = FN.calendar;
  const { Backup } = FN.backup;
  const { LineInput } = FN.lineInput;
  const { SwipeRows } = FN.swipeRows;

  class SettingsScreen {
    /** app: to draw whatever screen is showing again, after an import or an undo. */
    constructor({ notebook, sheet, toast, app }) {
      this.notebook = notebook;
      this.sheet = sheet;
      this.toast = toast;
      this.app = app;
      this.root = byId('settings');
      this.list = byId('machineList');
      this.addRow = byId('addMachineRow');
      this.examplesBtn = byId('removeExamples');
      this.importFile = byId('importFile');
      this.listen();
    }

    render() {
      this.renderList();
      this.renderAddRow();
      this.examplesBtn.hidden = !this.notebook.hasExamples();
    }

    renderList() {
      this.list.innerHTML = this.notebook.machinesAZ().map(machineRowHtml).join('');
    }

    renderAddRow() {
      this.addRow.className = 'bleed add-row add-row--pencil';
      this.addRow.innerHTML = '<button class="pencil-btn" type="button">tap here to add a machine</button>';
    }

    /* ---- Machines ---- */

    /** Turns the pencil line into a text field. It stays open after each machine, ready for the next. */
    startAdding() {
      this.addRow.className = 'bleed add-row';
      this.addRow.innerHTML = '<div class="row-content"></div>';
      const field = new LineInput({
        placeholder: 'machine name',
        label: 'New machine',
        onSubmit: (name, el) => {
          if (!name) return 'close';
          if (this.notebook.nameTaken(name)) {
            shake(el);
            return 'keep';
          }
          this.notebook.addMachine(name);
          this.renderList();
          return 'clear';
        },
        onClose: () => this.renderAddRow(),
      });
      this.addRow.firstElementChild.appendChild(field.el);
      field.focus();
    }

    rename(row) {
      const machine = this.notebook.machine(row.dataset.key);
      if (!machine) return;
      const field = new LineInput({
        value: machine.name,
        label: 'Machine name',
        onSubmit: (name, el) => {
          if (!name || name === machine.name) return 'close';
          if (this.notebook.nameTaken(name, machine.id)) {
            shake(el);
            return 'keep';
          }
          this.notebook.renameMachine(machine.id, name);
          return 'close';
        },
        onClose: () => this.renderList(),
      });
      row.querySelector('.name').replaceWith(field.el);
      field.focus();
    }

    removeMachine(id) {
      const undo = this.notebook.removeMachine(id);
      if (!undo) return;
      this.renderList();
      this.toast.show('Machine removed', () => {
        undo();
        this.renderList();
      });
    }

    removeExamples() {
      const undo = this.notebook.removeExamples();
      this.examplesBtn.hidden = true;
      this.toast.show('Example lines removed', () => {
        undo();
        this.app.refresh();
      });
    }

    /* ---- Backup ---- */

    exportFile() {
      const fileName = Backup.fileName(Calendar.today());
      downloadFile(fileName, Backup.toJson(this.notebook.data, new Date()));
      this.toast.show(`Saved ${fileName}`);
    }

    readImportFile(file) {
      const reader = new FileReader();
      reader.onerror = () => this.toast.show('That file could not be read');
      reader.onload = () => {
        const { data, error } = Backup.parse(String(reader.result));
        if (error) this.toast.show(error);
        else this.askToReplace(file.name, data);
      };
      reader.readAsText(file);
    }

    /** Shows what is in the file and replaces the notebook only after a yes. */
    askToReplace(fileName, data) {
      this.sheet.open({
        title: 'Import a notebook',
        info: {
          heading: fileName,
          details: Backup.describe(data),
          note: 'This replaces the notebook and the machines on this phone.',
        },
        columns: 'none',
        labels: [],
        wheels: [],
        actionLabel: 'Replace my notebook',
        cancelLabel: 'Cancel',
        onAction: () => {
          const undo = this.notebook.replaceAll(data);
          this.app.refresh();
          this.toast.show('Notebook replaced', () => {
            undo();
            this.app.refresh(); // you may have left Settings by now
          });
        },
      });
    }

    listen() {
      this.addRow.addEventListener('click', (e) => {
        if (e.target.closest('.pencil-btn')) this.startAdding();
      });
      this.examplesBtn.addEventListener('click', () => this.removeExamples());

      new SwipeRows(this.list, {
        onTap: (row) => this.rename(row),
        onDelete: (row) => this.removeMachine(row.dataset.key),
      });

      byId('exportBtn').addEventListener('click', () => this.exportFile());
      byId('importBtn').addEventListener('click', () => this.importFile.click());
      this.importFile.addEventListener('change', () => {
        const file = this.importFile.files[0];
        this.importFile.value = ''; // so the same file can be picked again
        if (file) this.readImportFile(file);
      });
    }
  }

  function machineRowHtml(machine) {
    const name = escapeHtml(machine.name);
    return (
      `<div class="row row--machine" role="listitem" tabindex="0" data-key="${escapeHtml(machine.id)}">` +
      `<div class="row-content"><span class="name">${name}</span></div>` +
      `<button class="row-delete" type="button" tabindex="-1" aria-label="Remove ${name}"><span>Delete</span></button>` +
      '</div>'
    );
  }

  FN.settingsScreen = { SettingsScreen };
})(globalThis.FN = globalThis.FN || {});
</script>

<script data-module="monthScreen">
/** The statistics screen: one month at a time, with arrows to the months before and after. */
(function (FN) {
  'use strict';
  const { DAY_NAMES, MONTH_NAMES, BLANK_ROW } = FN.config;
  const { escapeHtml, inRows } = FN.util;
  const { byId } = FN.dom;
  const { Calendar } = FN.calendar;
  const { Progress } = FN.progress;
  const { ChartMath } = FN.chartMath;

  const MAX_TALLY = 30; // above this only the number is shown

  const icon = (width, path) =>
    `<svg width="${width}" height="22" viewBox="0 0 ${width} 22" fill="none" stroke="currentColor" stroke-width="2.4" ` +
    `stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="${path}"/></svg>`;
  const CHEVRON = icon(12, 'M2 3l8 8-8 8');
  const ARROW_LEFT = icon(24, 'M20 11H4M10 5l-6 6 6 6');
  const ARROW_RIGHT = icon(24, 'M4 11h16M14 5l6 6-6 6');

  class MonthScreen {
    /** app: to open a machine's chart. */
    constructor({ notebook, app }) {
      this.notebook = notebook;
      this.app = app;
      this.root = byId('stats');
      this.body = byId('statsBody');
      this.month = null; // "YYYY-MM" on screen; null means this month
      this.body.addEventListener('click', (e) => this.onClick(e));
    }

    /** Start on this month the next time the screen is drawn. */
    goToThisMonth() {
      this.month = null;
    }

    render() {
      const today = Calendar.today();
      const dates = Progress.sessionDates(this.notebook.lines);
      const range = Calendar.monthRange(dates, today);
      this.month = Calendar.clampMonth(this.month || range.last, range);
      const { y, m } = Calendar.monthParts(this.month);
      const cells = Calendar.monthCells(dates, y, m, today);
      const isThisMonth = this.month === range.last;

      this.body.innerHTML =
        monthNavHtml(this.month, range) +
        weekDaysHtml() +
        inRows(cells, 7).map((week) => `<div class="week">${week.map(cellHtml).join('')}</div>`).join('') +
        BLANK_ROW +
        statLineHtml('sessions', Calendar.countTrained(cells)) +
        (isThisMonth ? statLineHtml('weeks in a row', Calendar.weeksInARow(dates, today)) : '') + // a streak is about now
        BLANK_ROW +
        machineLinksHtml(this.notebook.machinesAZ());
    }

    onClick(e) {
      const arrow = e.target.closest('[data-month]');
      if (arrow) {
        this.month = Calendar.shiftMonth(this.month, arrow.dataset.month === 'prev' ? -1 : 1);
        this.render();
        return;
      }
      const machine = e.target.closest('[data-machine]');
      if (machine) this.app.open({ view: 'machineStats', machineId: machine.dataset.machine });
    }
  }

  /* ---- Markup ---- */

  function monthNavHtml(month, range) {
    const { y, m } = Calendar.monthParts(month);
    const name = MONTH_NAMES[m - 1] + (y === new Date().getFullYear() ? '' : ` ${y}`);
    return (
      '<div class="month-nav">' +
      monthArrowHtml('prev', month > range.first) +
      `<span class="month-name" aria-live="polite">${name}</span>` +
      monthArrowHtml('next', month < range.last) +
      '</div>'
    );
  }

  /** An arrow to another month, or an empty spot of the same size when there is no month to go to. */
  function monthArrowHtml(direction, show) {
    if (!show) return '<span class="month-arrow" aria-hidden="true"></span>';
    const label = direction === 'prev' ? 'Month before' : 'Month after';
    return `<button class="month-arrow" type="button" data-month="${direction}" aria-label="${label}">${direction === 'prev' ? ARROW_LEFT : ARROW_RIGHT}</button>`;
  }

  function weekDaysHtml() {
    const mondayFirst = DAY_NAMES.slice(1).concat(DAY_NAMES[0]);
    return `<div class="week is-pencil is-small" aria-hidden="true">${mondayFirst.map((day) => `<span>${day}</span>`).join('')}</div>`;
  }

  function cellHtml(cell) {
    if (cell.state === 'trained') return `<span class="is-bold" role="img" aria-label="${cell.day}: trained">×</span>`;
    if (cell.state === 'rest') return '<span class="is-pencil" aria-hidden="true">·</span>';
    return '<span></span>';
  }

  function tallyHtml(count) {
    if (count < 1 || count > MAX_TALLY) return '';
    const { path, width } = ChartMath.tallyMarks(count);
    return (
      `<svg width="${width}" height="26" viewBox="0 0 ${width} 26" fill="none" stroke="currentColor" stroke-width="2.2" ` +
      `stroke-linecap="round" aria-hidden="true" focusable="false"><path d="${path}"/></svg>`
    );
  }

  function statLineHtml(label, count) {
    return `<div class="stat-line"><span>${label}</span>${tallyHtml(count)}<span class="mark">${count}</span></div>`;
  }

  function machineLinksHtml(machines) {
    if (!machines.length) return '<div class="stat-line is-pencil">no machines yet</div>';
    return machines
      .map((m) => `<button class="stat-link" type="button" data-machine="${escapeHtml(m.id)}"><span>${escapeHtml(m.name)}</span>${CHEVRON}</button>`)
      .join('');
  }

  FN.monthScreen = { MonthScreen };
})(globalThis.FN = globalThis.FN || {});
</script>

<script data-module="machineScreen">
/** The chart of one machine: its weight over time on the ruled lines, and when the weight changed. */
(function (FN) {
  'use strict';
  const { MONTH_SHORT, BLANK_ROW } = FN.config;
  const { formatKg, escapeHtml } = FN.util;
  const { byId } = FN.dom;
  const { Calendar } = FN.calendar;
  const { Progress } = FN.progress;
  const { ChartMath } = FN.chartMath;

  const MAX_CHART_ROWS = 5;   // ruled lines a chart may use as its grid
  const LINE_PX = 44;         // keep in sync with --line
  const RULE_Y = 36.5;        // where the ruled line sits inside a row
  const CHART_LEFT = 66;      // room for the kg written on the left
  const CHART_RIGHT_GAP = 28;
  const MAX_DOTS = 24;        // with more points, only the changes get a dot
  const MAX_DATE_LABELS = 5;  // with more changes, the chart shows months instead of dates

  class MachineScreen {
    constructor({ notebook }) {
      this.notebook = notebook;
      this.root = byId('machineStats');
      this.title = byId('machineStatsTitle');
      this.body = byId('machineStatsBody');
    }

    render({ machineId }) {
      const machine = this.notebook.machine(machineId);
      const name = machine ? machine.name : 'Machine';
      this.title.textContent = name;
      const points = Progress.machineHistory(this.notebook.lines, machineId);
      this.body.innerHTML = points.length
        ? chartHtml(name, points, this.body.clientWidth || 326) + changesHtml(points)
        : '<div class="stat-line is-pencil">nothing logged yet</div>';
    }
  }

  /* ---- Markup ---- */

  function chartHtml(name, points, width) {
    const weights = points.map((p) => p.weight);
    const scale = ChartMath.scale(weights, MAX_CHART_ROWS);
    const rows = ChartMath.rowsNeeded(weights, scale, MAX_CHART_ROWS);
    const height = rows * LINE_PX;
    const xy = ChartMath.pointPositions(points, scale, { left: CHART_LEFT, right: width - CHART_RIGHT_GAP, firstLineY: RULE_Y, lineHeight: LINE_PX });
    const dots = points.length <= MAX_DOTS ? xy : Progress.changeIndexes(points).map((i) => xy[i]);
    const first = points[0];
    const last = points[points.length - 1];
    const label =
      `${escapeHtml(name)}: ${points.length} times, from ${formatKg(first.weight)} kg on ${Calendar.written(first.date).date} ` +
      `to ${formatKg(last.weight)} kg on ${Calendar.written(last.date).date}`;

    return (
      `<div class="chart" style="height: ${height}px">` +
      ChartMath.axisValues(scale, rows).map(({ row, value }, i) => `<span class="axis" style="top: ${row * LINE_PX}px">${formatKg(value)}${i === 0 ? ' kg' : ''}</span>`).join('') +
      `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" fill="none" role="img" aria-label="${label}">` +
      `<path d="M${xy.map((p) => `${p.x} ${p.y}`).join('L')}" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>` +
      `<g fill="currentColor">${dots.map((p) => `<circle cx="${p.x}" cy="${p.y}" r="4"/>`).join('')}</g>` +
      '</svg></div>' +
      `<div class="x-labels" aria-hidden="true">${xLabels(points, xy).map((l) => `<span style="left: ${l.x}px">${l.text}</span>`).join('')}</div>`
    );
  }

  /** What is written under the chart: a date under each change when they fit, else month names. */
  function xLabels(points, xy) {
    const changes = Progress.changeIndexes(points);
    if (changes.length <= MAX_DATE_LABELS && ChartMath.spacedOut(changes.map((i) => xy[i].x), 50)) {
      return changes.map((i) => ({ x: xy[i].x, text: Calendar.written(points[i].date).date }));
    }
    const thisYear = new Date().getFullYear();
    return ChartMath.monthLabels(points, xy, 48).map((label, i) => ({
      x: label.x,
      text: MONTH_SHORT[label.month - 1] + (i === 0 && label.year !== thisYear ? ` '${String(label.year).slice(-2)}` : ''),
    }));
  }

  /** The list under the chart: every time the weight was new, newest first. */
  function changesHtml(points) {
    const rows = Progress.weightChanges(points).reverse().map((change) => {
      const { date, day } = Calendar.written(change.date);
      return `<div class="stat-line"><span>${date}</span><span>${day}</span><span class="mark">${formatKg(change.weight)} kg</span></div>`;
    });
    return BLANK_ROW + '<div class="stat-line is-pencil">when the weight changed</div>' + rows.join('');
  }

  FN.machineScreen = { MachineScreen };
})(globalThis.FN = globalThis.FN || {});
</script>

<script data-module="app">
/** Start-up and moving between the screens: notebook, settings, statistics, machine chart. */
(function (FN) {
  'use strict';
  const { STORAGE_KEY } = FN.config;
  const { byId, onNextFrame, scrollToBottom } = FN.dom;
  const { Store } = FN.store;
  const { Notebook } = FN.notebook;
  const { Toast } = FN.toast;
  const { Sheet } = FN.sheet;
  const { NotebookScreen } = FN.notebookScreen;
  const { SettingsScreen } = FN.settingsScreen;
  const { MonthScreen } = FN.monthScreen;
  const { MachineScreen } = FN.machineScreen;

  class App {
    constructor() {
      this.toast = new Toast();
      this.sheet = new Sheet({ toast: this.toast });
      this.notebook = new Notebook(Store.load() || Notebook.exampleData(), { onSave: (data) => Store.save(data) });

      const parts = { notebook: this.notebook, sheet: this.sheet, toast: this.toast, app: this };
      this.screens = {
        notebook: new NotebookScreen(parts),
        settings: new SettingsScreen(parts),
        stats: new MonthScreen(parts),
        machineStats: new MachineScreen(parts),
      };
      this.topButtons = [byId('cogBtn'), byId('statsBtn')];
      this.current = { view: 'notebook' };
      this.notebookScrollY = 0;
    }

    /** Shows a screen. `next` is { view } or, for a machine chart, { view: 'machineStats', machineId }. */
    show(next) {
      const target = next && this.screens[next.view] ? next : { view: 'notebook' };
      this.sheet.cancel();
      if (this.current.view === 'notebook' && target.view !== 'notebook') {
        this.notebookScrollY = window.scrollY;
        this.screens.stats.goToThisMonth();
      }
      this.current = target;
      for (const [name, screen] of Object.entries(this.screens)) screen.root.hidden = name !== target.view;
      this.topButtons.forEach((button) => { button.hidden = target.view !== 'notebook'; });
      this.refresh();
      window.scrollTo(0, target.view === 'notebook' ? this.notebookScrollY : 0);
      this.screens.notebook.updateTodayButton();
    }

    /** Draws the screen that is showing again. */
    refresh() {
      this.screens[this.current.view].render(this.current);
    }

    /** Shows a screen and remembers it, so the phone's back gesture returns here. */
    open(next) {
      try {
        history.pushState(next, '');
      } catch (_) {
        /* history not available (sandboxed frame): the back arrows still work */
      }
      this.show(next);
    }

    back(fallbackView) {
      const pushed = history.state && history.state.view === this.current.view && this.current.view !== 'notebook';
      if (pushed) history.back(); // popstate shows the screen underneath
      else this.show({ view: fallbackView });
    }

    start() {
      try {
        history.scrollRestoration = 'manual';
        history.replaceState({ view: 'notebook' }, '');
      } catch (_) {
        /* not available: fine */
      }
      this.notebook.save();
      this.screens.notebook.render();
      scrollToBottom(false);
      if (document.fonts && document.fonts.ready) {
        const y = window.scrollY;
        document.fonts.ready.then(() => {
          if (this.current.view === 'notebook' && window.scrollY === y) scrollToBottom(false);
        });
      }
      this.listen();
    }

    listen() {
      byId('cogBtn').addEventListener('click', () => this.open({ view: 'settings' }));
      byId('statsBtn').addEventListener('click', () => this.open({ view: 'stats' }));
      document.querySelectorAll('[data-back]').forEach((button) => {
        button.addEventListener('click', () => this.back(button.dataset.back));
      });
      window.addEventListener('popstate', (e) => this.show(e.state));

      const refreshTodayButton = onNextFrame(() => this.screens.notebook.updateTodayButton());
      window.addEventListener('scroll', refreshTodayButton, { passive: true });
      window.addEventListener('resize', () => {
        refreshTodayButton();
        if (this.current.view === 'machineStats') this.refresh(); // the chart follows the page width
      });

      // Another tab changed the notebook: show the new version.
      window.addEventListener('storage', (e) => {
        const typing = document.activeElement && document.activeElement.classList.contains('line-input');
        if (e.key !== STORAGE_KEY || this.sheet.isOpen() || typing) return;
        this.notebook.reload(Store.load() || Notebook.exampleData());
        this.refresh();
      });
    }
  }

  const app = new App();
  app.start();

  FN.app = { App, app };
})(globalThis.FN = globalThis.FN || {});
</script>
</body>
</html>
