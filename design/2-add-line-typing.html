<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typing your own line</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background-color: #e8d3bc; font-family: 'Caveat', cursive; font-weight: 500; font-size: 27px; color: #1d3a8a">
<div aria-hidden="true" style="position: absolute; left: 20px; right: 20px; top: 44px; bottom: 0; background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 36px, #5a5048 36px, #5a5048 37px, transparent 37px, transparent 44px)"></div>
<div style="position: absolute; top: 44px; left: 32px; right: 32px; display: flex; flex-direction: column">
<div style="height: 44px; line-height: 44px; display: flex; align-items: baseline; gap: 12px"><span>Seated row</span><span>40 × 3 × 12</span><span style="margin-left: auto">–1</span></div>
<div style="height: 44px"></div>
<div style="height: 44px; line-height: 44px; display: flex; align-items: baseline; gap: 12px; font-weight: 700"><span>18/11</span><span>wo</span></div>
<div style="height: 44px; line-height: 44px; color: #4d535c">Biking Basics New Zealand #16</div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 300px; box-sizing: border-box; padding: 18px 16px 16px; background: #f6ecdf; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; gap: 10px">
<input type="text" aria-label="Write your own line" value="Biking Basics New Zealand #16" style="box-sizing: border-box; width: 100%; height: 48px; margin: 0; padding: 0 14px; border: 2px solid #1d3a8a; border-radius: 12px; background: #fffaf3; color: #1c1c1e; font-family: -apple-system, 'Inter', sans-serif; font-size: 17px">
<button type="button" style="width: 100%; height: 56px; border: 0; border-radius: 14px; background: #1d3a8a; color: #ffffff; font-family: -apple-system, 'Inter', sans-serif; font-weight: 600; font-size: 17px">Log</button>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 300px; box-sizing: border-box; background: #d3d6dc; display: flex; align-items: center; justify-content: center; font-family: -apple-system, 'Inter', sans-serif; font-size: 17px; font-weight: 600; color: #1c1c1e">iPhone keyboard</div>
</div>
</body>
</html>
